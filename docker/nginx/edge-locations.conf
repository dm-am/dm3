# Everything the edge does, once. Included by the plain server and by the TLS server that
# docker/scripts/init-ssl.sh writes, so the two cannot drift: the TLS server used to be a
# commented-out copy that lost the health probe and kept a listen directive nginx warns
# about. Not here: the ACME challenge (plain server only) and the https redirect (it exists
# only once there is https).

# The door, here rather than in each server: a server that forgot it would be open to the
# internet.
auth_basic "DM Preview - Restricted Access";
auth_basic_user_file /etc/nginx/.htpasswd;

# Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The API sets the same four headers on every response (SecurityHeadersMiddleware), and
# add_header appends to what an upstream sent, so /v1/ and /hubs/ would leave with two
# copies. They agree today, but once one layer is edited the parsing rules of that header,
# not the author, decide which copy wins (SECURITY.md). One policy, one layer: the edge.
# The API keeps its middleware because it is also reached without a proxy (the end-to-end
# tier and the ZAP scan). Content-Security-Policy is not hidden: the edge sets none, so the
# API and SPA copy is the only one.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

# Health check endpoint (no auth required). default_type, not an add_header of
# Content-Type: a return with a body already sets one, add_header would append a second,
# and at location level it also cancels the inheritance of the four headers above.
location /nginx-health {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok";
}

# Liveness and readiness of the API for a monitor outside the host. Without a location of
# their own these paths fall into "/" and the SPA fallback answers 200, so the heartbeat
# reported a healthy site while only nginx and a static container lived. Exact matches, not
# a prefix: /_health/detail names every dependency and /metrics is the whole instrumentation.
location = /_health {
    auth_basic off;
    access_log off;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /_ready {
    auth_basic off;
    access_log off;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API proxy
location /v1/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SignalR hub (Startup maps it at /hubs/notifications). The /hubs prefix is
# reserved for hubs so it can never collide with an SPA page route.
location /hubs/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# Uploads (images and the thumbnails of avatars), object storage through its S3 proxy
location /dm-uploads/ {
    auth_basic off;
    proxy_pass http://storage:9000/dm-uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host storage:9000;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Frontend
location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
