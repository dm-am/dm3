# Everything the edge does, once.
#
# Included by the plain server and by the TLS server scripts/init-ssl.sh writes,
# so the two cannot drift apart. They did: the TLS server used to be a commented
# out copy of this, and by the time anybody would have switched it on it had lost
# the health probe and carried a listen directive nginx has warned about since
# 1.25.
#
# What is not here: the ACME challenge, which only the plain server answers, and
# the redirect to https, which only exists once there is somewhere to redirect to.

# The door, here rather than in each server: a server that forgot it would be a
# stand open to the internet, and forgetting is exactly what happens to a line
# that has to be written twice.
auth_basic "DM Preview - Restricted Access";
auth_basic_user_file /etc/nginx/.htpasswd;

# Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The API sets the same four on every response of its own
# (SecurityHeadersMiddleware); add_header appends rather than replaces
# what an upstream sent, so /v1/ and /hubs/ left with two copies of
# each. Two identical copies are not an outage: every one of these four
# parses to the same decision while the values agree, which is why
# nothing on the stand was ever seen to break. The rule in SECURITY.md
# is about the day they stop agreeing - the value gets edited in one of
# the two layers, and which copy wins is then decided by the parsing
# rules of that particular header rather than by whoever made the edit.
# One policy, one layer, and here the layer is the edge: the API is also
# reached with no proxy in front of it (the end-to-end tier and the ZAP
# scan both talk to its port directly), so its middleware keeps setting
# them.
#
# Content-Security-Policy is deliberately off this list. The edge sets
# none, so the copy the API and the SPA container set is the only one
# there is, and hiding it would leave those responses with no policy.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

# Health check endpoint (no auth required)
#
# default_type rather than an add_header of Content-Type: nginx already
# sets a Content-Type on a return with a body, taken from default_type,
# and the directive appends instead of replacing, so the probe answered
# with two of them. The second cost is the one that matters here: at
# location level the directive also cancels the inheritance of the four
# above, so this was the single path of the stand that carried no
# security header at all.
location /nginx-health {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok";
}

# Liveness and readiness of the API itself, for a monitor outside the
# host. Without a location of their own these paths fall into "/", which
# proxies the SPA container, and the SPA fallback answers index.html
# with 200 - so the external heartbeat the monitoring guide recommends
# reported a healthy site for exactly as long as nginx and a static
# container were alive. Exact matches rather than a prefix:
# /_health/detail names every dependency and its state, and /metrics is
# the whole instrumentation of the process; both stay on the inside.
location = /_health {
    auth_basic off;
    access_log off;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /_ready {
    auth_basic off;
    access_log off;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API proxy
location /v1/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SignalR hub (Startup maps it at /hubs/notifications). The /hubs prefix is
# reserved for hubs so it can never collide with an SPA page route.
location /hubs/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# MinIO uploads (images)
location /dm-uploads/ {
    auth_basic off;
    proxy_pass http://minio:9000/dm-uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Image transforms (imgproxy). The API hands out same-origin /img/ URLs,
# so thumbnails resolve against whatever host the stand answers on. The
# trailing slash on proxy_pass is load-bearing: the signature covers the
# path from the options onwards, so the prefix has to be stripped before
# imgproxy sees it. The prefix is not the SPA's own static /images/, and
# nginx matches prefixes, so the two never overlap.
location /img/ {
    # auth_basic stays on here, unlike /dm-uploads/: the URL signature is
    # all that stands between imgproxy and arbitrary transforms, and it
    # is one key on one machine - generated by init-env.sh, replaced on
    # every server install, worth nothing the moment it leaks. The
    # browser sends the stand credentials with every subresource of a
    # page it has already authenticated for.
    proxy_pass http://imgproxy:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Those credentials stop here, as they do for MinIO.
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Frontend
location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
