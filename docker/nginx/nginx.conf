worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The stock mime.types stops at woff and woff2, so TrueType and OpenType fall to the
    # default type and the font/ttf entry of gzip_types, which matches on type, never
    # matched. Declared after the include to override the distribution.
    types {
        font/ttf   ttf;
        font/otf   otf;
    }
    sendfile      on;
    keepalive_timeout 65;

    # The default is one megabyte and the upload endpoint accepts ten, so a file between
    # the two got an HTML 413 from the edge instead of the API error shape. Must match
    # RequestSizeLimit on UploadController; EdgeConfigurationShould compares the two.
    client_max_body_size 10m;

    # Hide the nginx version.
    server_tokens off;

    # "upgrade" only when the client asked for one: hardcoding it breaks keepalive on
    # ordinary REST traffic.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        # TrueType carries no compression of its own, and the site's font family is TrueType.
        font/ttf;

    # Upstream servers: the two links the edge's command sets in its own layer, one for api and
    # one for frontend, each to a file of docker/nginx/upstreams. A rollout points both at the
    # twins and reloads, and every restart of the edge points them back at the primaries. With
    # no link the glob matches nothing and the parse fails on the unknown upstream, so the edge
    # never starts without a backend. Every name in those files and every literal name in a
    # proxy_pass is resolved at parse time and held until the next reload. There is no
    # resolver directive: a variable in proxy_pass would re-resolve but drops the URI part that
    # the object store and signed renderer paths depend on. So a container replaced behind this
    # edge outside a rollout needs a reload or a recreated edge: the updater recreates it for
    # the application images (labels on the nginx service in the preview overlay), and whoever
    # replaces anything else does it by hand (DEPLOYMENT.md).
    include /etc/nginx/upstreams-live/*.conf;

    # The rollout's listener: it asks through the upstreams the edge has loaded, without the
    # door's password. Loopback inside the container, and the compose file publishes 80 and
    # 443 only, so nothing outside the container reaches it.
    server {
        listen 127.0.0.1:8081;

        location = /_ready {
            proxy_pass http://api/_ready;
        }

        location = /_instance {
            proxy_pass http://frontend/_instance;
        }

        location / {
            return 404;
        }
    }

    # The plain, default server: it answers whatever arrives without a recognised name, so
    # the stand is reached by address before it has a domain. The redirect belongs to the
    # named server docker/scripts/init-ssl.sh writes, so the domain goes https-only while
    # the address keeps answering behind the door above.
    server {
        listen 80;
        server_name _;

        # The one path that must answer before a certificate exists and outside the door:
        # the certificate authority fetches it anonymously. ^~ beats the prefix that proxies
        # the SPA, since a challenge answered with index.html never gets a certificate issued.
        location ^~ /.well-known/acme-challenge/ {
            auth_basic off;
            access_log off;
            root /var/www/certbot;
        }

        include /etc/nginx/edge-locations.conf;
    }

    # The TLS server, when there is a certificate. docker/scripts/init-ssl.sh writes this
    # file after certbot issues it, so the stand serves plain http until then and never a
    # self-signed certificate. A glob matching nothing is not an error.
    include /etc/nginx/tls/*.conf;
}
