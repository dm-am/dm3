worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The stock mime.types names woff and woff2 and stops there: TrueType and
    # OpenType fall through to the default type above, and gzip_types matches on
    # the type, not on the extension. So the font/ttf entry in gzip_types below
    # matched nothing at all and the megabyte it was added for kept travelling
    # raw, with the configuration reading as though it did not. Declared here,
    # after the include, so it overrides whatever the distribution ships.
    types {
        font/ttf   ttf;
        font/otf   otf;
    }
    sendfile      on;
    keepalive_timeout 65;

    # nginx defaults to one megabyte and the upload endpoint accepts ten, so a
    # file between the two was cut here: what the visitor got was an HTML 413
    # from the edge, which is neither the API error shape nor carries a CORS
    # header, so the form could not even show the refusal at the field. Client
    # side compression does not bound it either - a file whose sides are under
    # 1024 px is returned untouched. The number has to match RequestSizeLimit on
    # UploadController, and DeploymentConfigurationShould compares the two.
    client_max_body_size 10m;

    # Security: Hide nginx version
    server_tokens off;

    # Connection header for proxied requests: "upgrade" only when the client
    # actually asked for one. Hardcoding it breaks keepalive on ordinary REST
    # traffic, which is every request except the SignalR hub.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        # TrueType carries no compression of its own, and the site's family is
        # TrueType: without this line the edge hands over a raw megabyte.
        font/ttf;

    # Upstream servers
    upstream api {
        server dmapi:5000;
    }

    upstream frontend {
        server dmfront:80;
    }

    # HTTP server - redirects to HTTPS when SSL is enabled
    server {
        listen 80;
        server_name _;

        # Uncomment the following lines when SSL certificates are available:
        # return 301 https://$host$request_uri;

        # Basic auth for all requests
        auth_basic "DM Preview - Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # The API sets the same five on every response of its own
        # (SecurityHeadersMiddleware); add_header appends rather than replaces
        # what an upstream sent, so /v1/ and /whatsup left with two copies of
        # each. Two identical copies are not an outage: every one of these five
        # parses to the same decision while the values agree, which is why
        # nothing on the stand was ever seen to break. The rule in SECURITY.md
        # is about the day they stop agreeing - the value gets edited in one of
        # the two layers, and which copy wins is then decided by the parsing
        # rules of that particular header rather than by whoever made the edit.
        # One policy, one layer, and here the layer is the edge: the API is also
        # reached with no proxy in front of it (the end-to-end tier and the ZAP
        # scan both talk to its port directly), so its middleware keeps setting
        # them.
        #
        # Content-Security-Policy is deliberately off this list. The edge sets
        # none, so the copy the API and the SPA container set is the only one
        # there is, and hiding it would leave those responses with no policy.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        # Health check endpoint (no auth required)
        #
        # default_type rather than an add_header of Content-Type: nginx already
        # sets a Content-Type on a return with a body, taken from default_type,
        # and the directive appends instead of replacing, so the probe answered
        # with two of them. The second cost is the one that matters here: at
        # location level the directive also cancels the inheritance of the five
        # above, so this was the single path of the stand that carried no
        # security header at all.
        location /nginx-health {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Liveness and readiness of the API itself, for a monitor outside the
        # host. Without a location of their own these paths fall into "/", which
        # proxies the SPA container, and the SPA fallback answers index.html
        # with 200 - so the external heartbeat the monitoring guide recommends
        # reported a healthy site for exactly as long as nginx and a static
        # container were alive. Exact matches rather than a prefix:
        # /_health/detail names every dependency and its state, and /metrics is
        # the whole instrumentation of the process; both stay on the inside.
        location = /_health {
            auth_basic off;
            access_log off;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /_ready {
            auth_basic off;
            access_log off;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy
        location /v1/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR hub (Startup maps it at /whatsup)
        location /whatsup {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # MinIO uploads (images)
        location /dm-uploads/ {
            auth_basic off;
            proxy_pass http://minio:9000/dm-uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Image transforms (imgproxy). The API hands out same-origin /img/ URLs,
        # so thumbnails resolve against whatever host the stand answers on. The
        # trailing slash on proxy_pass is load-bearing: the signature covers the
        # path from the options onwards, so the prefix has to be stripped before
        # imgproxy sees it. The prefix is not the SPA's own static /images/, and
        # nginx matches prefixes, so the two never overlap.
        location /img/ {
            # auth_basic stays on here, unlike /dm-uploads/: the URL signature is
            # all that stands between imgproxy and arbitrary transforms, and it
            # is one key on one machine - generated by init-env.sh, replaced on
            # every server install, worth nothing the moment it leaks. The
            # browser sends the stand credentials with every subresource of a
            # page it has already authenticated for.
            proxy_pass http://imgproxy:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Those credentials stop here, as they do for MinIO.
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server - uncomment when SSL certificates are available
    # To generate self-signed certificates for testing:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/privkey.pem \
    #     -out /etc/nginx/ssl/fullchain.pem \
    #     -subj "/CN=localhost"
