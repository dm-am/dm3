worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The stock mime.types names woff and woff2 and stops there: TrueType and
    # OpenType fall through to the default type above, and gzip_types matches on
    # the type, not on the extension. So the font/ttf entry in gzip_types below
    # matched nothing at all and the megabyte it was added for kept travelling
    # raw, with the configuration reading as though it did not. Declared here,
    # after the include, so it overrides whatever the distribution ships.
    types {
        font/ttf   ttf;
        font/otf   otf;
    }
    sendfile      on;
    keepalive_timeout 65;

    # nginx defaults to one megabyte and the upload endpoint accepts ten, so a
    # file between the two was cut here: what the visitor got was an HTML 413
    # from the edge, which is neither the API error shape nor carries a CORS
    # header, so the form could not even show the refusal at the field. Client
    # side compression does not bound it either - a file whose sides are under
    # 1024 px is returned untouched. The number has to match RequestSizeLimit on
    # UploadController, and DeploymentConfigurationShould compares the two.
    client_max_body_size 10m;

    # Security: Hide nginx version
    server_tokens off;

    # Connection header for proxied requests: "upgrade" only when the client
    # actually asked for one. Hardcoding it breaks keepalive on ordinary REST
    # traffic, which is every request except the SignalR hub.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        # TrueType carries no compression of its own, and the site's family is
        # TrueType: without this line the edge hands over a raw megabyte.
        font/ttf;

    # Upstream servers.
    #
    # Every name here and every literal name in a proxy_pass below is resolved once,
    # while this file is being parsed, and the address is then held for the life of
    # the process. There is no resolver directive and none is being added: a variable
    # in proxy_pass would make nginx re-resolve, but it also drops the URI part of
    # the target, which the object store path and the signed renderer path below both
    # depend on.
    #
    # So the rule is the other way round: replacing a container behind this edge ends
    # with recreating the edge. For the application images the updater does it, by the
    # labels on the nginx service in the preview overlay. For everything it does not
    # watch - the object store, the image renderer, any manual --force-recreate - it
    # is the job of whoever does the replacing. DEPLOYMENT.md states it as a rule.
    upstream api {
        server dmapi:5000;
    }

    upstream frontend {
        server dmfront:80;
    }

    # The plain server, and the default one: it answers whatever arrives without a
    # name it recognises, which is how the stand is reached by address before it has
    # a domain. It keeps working after a certificate exists - the redirect belongs to
    # the named server scripts/init-ssl.sh writes, so the domain becomes https-only
    # while the address keeps answering behind the door above.
    server {
        listen 80;
        server_name _;

        # The one path that has to answer before a certificate exists, and the one
        # the door above must not stand in front of: the certificate authority
        # fetches it anonymously from the public internet. ^~ so it wins over the
        # prefix that proxies the SPA - a challenge answered with index.html is a
        # certificate that never gets issued, and the message says nothing useful.
        location ^~ /.well-known/acme-challenge/ {
            auth_basic off;
            access_log off;
            root /var/www/certbot;
        }

        include /etc/nginx/edge-locations.conf;
    }

    # The TLS server, when there is a certificate to serve it with.
    #
    # A file rather than a commented-out block: the block that used to sit here had
    # been commented out since the first day and had already drifted away from the
    # live one - no health probe, and a listen directive in a form nginx has warned
    # about since 1.25 - so the thing that was supposed to be switched on in the
    # hour it was needed would not have started.
    #
    # scripts/init-ssl.sh writes this file after certbot issues the certificate, so
    # the stand serves plain http until there is a real certificate and never a
    # self-signed one: a warning page teaches the reader to click through warnings.
    # A glob matching nothing is not an error.
    include /etc/nginx/tls/*.conf;
}
