    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #
    #     # The upstream sets the same five, and add_header appends rather than
    #     # replaces - the note in the server above says the rest. The lines
    #     # stand here instead of a reminder to add them because this half is
    #     # what gets switched on the day certificates arrive, and nobody
    #     # re-reads it before that day.
