networks:
  default:
    name: 'dm-full-app'
    # Fixed subnet: the API trusts it as the source of X-Forwarded-For, and it must
    # equal DM_ReverseProxyConfiguration__TrustedNetworks in docker-compose.preview.yml.
    ipam:
      config:
        - subnet: '172.28.0.0/16'
  # The object store's own network, internal: SeaweedFS runs admin, filer and volume
  # servers that answer without a password, so only the store and its proxy "storage"
  # may reach them.
  storage-internal:
    name: 'dm-storage-internal'
    internal: true

name: dm

volumes:
  pgdata:
  lokidata:
  storagedata:
  alertmanagerdata:
  prometheusdata:

# Defaults for local development; a point of presence overrides them in .env.pop.
x-workload-env: &workload-env
  # === ASP.NET Core ===
  # Production unless overridden: Development maps Swagger UI and relaxes the script CSP.
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

  # === Наблюдаемость ===
  # One level for both sinks. Empty follows the environment (Debug in Development, else
  # Information). Use it for an incident instead of Development, which also publishes
  # Swagger and drops HSTS. A value Serilog does not know fails the start.
  DM_Observability__MinimumLevel: ${LOG_MINIMUM_LEVEL:-}

  # === Базы данных ===
  # The application role, not the superuser: a leaked superuser password is the whole
  # server. postgres-init.sh creates it, and it owns the database because Postgres 15
  # allows CREATE in schema public to the owner only.
  #
  # The pools are a budget against max_connections of the postgres service. The peak is a
  # rollout, with the API, its twin and both workers open at once: 50 + 50 + 20 + 20 = 140.
  # The migration's pool and the twin's are never open together, since migrations run before
  # the twin starts, so the peak is 140 either way. The 20 left of 160 hold what opens single
  # connections: PostgreSQL's superuser_reserved_connections, which count inside
  # max_connections, the exporter, a backup's pg_dump, an operator's psql and the check
  # scripts. check-compose-topology.sh asserts the sum. The API's 50 is the figure the load
  # test of part 8 of the plan revisits.
  DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=${DB_USER:-dm_app};Password=${DM_APP_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=50;Connection Idle Lifetime=60;${DB_SSL_MODE:-}
  DM_ConnectionStrings__Logs: http://${LOGS_HOST:-dm-loki}:3100
  DM_ConnectionStrings__TracingEndpoint: http://${TRACING_HOST:-dm-jaeger}:4317

  # === Криптография ===
  # No default: an empty value fails the start, since a key inherited from the repository
  # is no secret. The key lives on the one application instance; a point of presence
  # runs no application code.
  DM_CryptoConfiguration__KeyBase64: ${DM_CryptoConfiguration__KeyBase64:?DM_CryptoConfiguration__KeyBase64 is required, generate with openssl rand -base64 32}

  # === CDN (object storage) ===
  DM_CdnConfiguration__Url: http://${STORAGE_HOST:-dm-storage}:9000
  DM_CdnConfiguration__PublicUrl: ${CDN_PUBLIC_URL:-http://localhost:9000}
  DM_CdnConfiguration__Region: us-east-1
  # Never changed after installation: on a volume with the old bucket a new name creates a
  # second, empty one while every health check stays green.
  DM_CdnConfiguration__BucketName: ${STORAGE_BUCKET:-dm-uploads}
  # A service account scoped to one bucket, not an administrator. storage-start.sh
  # declares it on every start of seaweedfs.
  DM_CdnConfiguration__AccessKey: ${STORAGE_APP_USER:-dm-app}
  DM_CdnConfiguration__SecretKey: ${STORAGE_APP_PASSWORD:?STORAGE_APP_PASSWORD is required}
  DM_CdnConfiguration__Provider: SelfHosted

  # === Email ===
  DM_EmailConfiguration__ServerHost: ${MAIL_HOST:-dm-mailpit}
  DM_EmailConfiguration__ServerPort: ${MAIL_PORT:-1025}
  # Empty username means no authentication, which Mailpit on a stand takes.
  DM_EmailConfiguration__Username: ${MAIL_USERNAME:-}
  DM_EmailConfiguration__Password: ${MAIL_PASSWORD:-}
  DM_EmailConfiguration__FromAddress: info@dm.am
  DM_EmailConfiguration__FromDisplayName: DM.am
  DM_EmailConfiguration__ReplyToAddress: test@dm.am
  # Opportunistic STARTTLS by default: Mailpit offers it only with a certificate the stand
  # lacks. A real relay sets true, so the session fails instead of sending activation links
  # in clear text.
  DM_EmailConfiguration__RequireTls: ${MAIL_REQUIRE_TLS:-false}

  # Empty keeps the cookie on the issuing host. A registrable domain shares one login
  # across hosts; set it only when every host of that domain is ours.
  DM_SessionCookieConfiguration__Domain: ${SESSION_COOKIE_DOMAIN:-}

  # === Боты уведомлений ===
  # Optional: empty keeps both webhooks closed (404) and bot notifications off. Forwarded
  # by name, because this anchor is an explicit list.
  DM_BotConfiguration__TelegramBotToken: ${DM_BotConfiguration__TelegramBotToken:-}
  DM_BotConfiguration__TelegramWebhookSecret: ${DM_BotConfiguration__TelegramWebhookSecret:-}
  DM_BotConfiguration__DiscordBotToken: ${DM_BotConfiguration__DiscordBotToken:-}
  DM_BotConfiguration__DiscordPublicKey: ${DM_BotConfiguration__DiscordPublicKey:-}

  # === Адреса сайта ===
  # PublicUrl is the address this deployment calls itself, and all links in mail are built
  # from it. The origins allowed to call the API are derived from it, not configured.
  DM_SiteAddressConfiguration__PublicUrl: ${WEB_URL:-http://localhost:5173}

# One image tag per CI run for all four images, since they come from one commit. A
# rollback is IMAGE_TAG in .env set to the short sha of an earlier run. A release on a
# server names each image by digest instead, through DM_IMAGE_API, DM_IMAGE_FRONT,
# DM_IMAGE_WORKER_MAIL and DM_IMAGE_WORKER_NOTIFICATION from its release.env; unset, the
# IMAGE_TAG form stays, so the stand and the point of presence run as before.
# SOURCE_REVISION in the build arguments becomes the image's revision label, which the
# release reads; unset it is empty.
x-docker-context: &docker-context
  context: ./..
  dockerfile: ./docker/app.Dockerfile

services:
  # --- Infrastructure: Databases ---

  postgres:
    container_name: 'dm-pg'
    image: 'postgres:18'
    # The ceiling the pools of x-workload-env are budgeted against; the image's own default
    # of 100 is below the peak of a rollout.
    command: ["postgres", "-c", "max_connections=160"]
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by postgres-init.sh on the first initialisation of the volume.
      DM_APP_PASSWORD: ${DM_APP_PASSWORD}
      DM_EXPORTER_PASSWORD: ${DM_EXPORTER_PASSWORD}
    volumes:
      # The image of 18 keeps the cluster in a versioned directory under /var/lib/postgresql
      # and declares that directory as its volume: a mount on the old .../data path would
      # leave the cluster in an anonymous volume.
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dm3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  # Pinned to 3.5, the last image with a shell and wget: 3.6 and later are distroless and
  # offer no probe inside the container, and a probe that says healthy on start is worse
  # than none.
  loki:
    container_name: 'dm-loki'
    image: 'grafana/loki:3.5.12'
    command: '-config.file=/etc/loki/loki.yaml'
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Dev Tools ---

  # Mail trap for the stand on the ports MailHog had; MailHog is archived and Mailpit replaces it.
  mailpit:
    container_name: 'dm-mailpit'
    image: 'axllent/mailpit:v1.33.1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      # Without -d the database is a temporary file. The number caps stored messages.
      MP_MAX_MESSAGES: '500'
      # The update check calls out, and the stand also runs offline.
      MP_DISABLE_VERSION_CHECK: 'true'
    # The image's own probe: the container has neither curl nor wget.
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Infrastructure: Object Storage ---

  # SeaweedFS in one-process mode: master, volume server, filer, S3 and the admin server
  # that runs vacuum (why this store: docs/STACK.md). On storage-internal only and
  # publishes nothing; storage-start.sh sets the bucket, accounts and anonymous reads from
  # the variables here.
  seaweedfs:
    container_name: 'dm-seaweedfs'
    # Tag and digest: a tag can be rewritten and the one-process mode moves its defaults
    # between releases. A new tag needs check-storage.sh green in deployment-smoke.
    image: 'chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0'
    entrypoint: ["/bin/sh", "/storage-start.sh"]
    environment:
      # Without a limit the heap grows to 233 MiB of the 256M container; with it the peak is
      # near 120 MiB at about 8% of a core when idle. check-storage.sh holds both numbers.
      GOMEMLIMIT: 180MiB
      STORAGE_BUCKET: ${STORAGE_BUCKET:-dm-uploads}
      STORAGE_APP_USER: ${STORAGE_APP_USER:-dm-app}
      STORAGE_APP_PASSWORD: ${STORAGE_APP_PASSWORD:?STORAGE_APP_PASSWORD is required}
      STORAGE_BACKUP_USER: ${STORAGE_BACKUP_USER:-dm-backup}
      STORAGE_BACKUP_PASSWORD: ${STORAGE_BACKUP_PASSWORD:?STORAGE_BACKUP_PASSWORD is required}
    volumes:
      - ./storage-start.sh:/storage-start.sh:ro
      - storagedata:/data
    networks:
      - storage-internal
    # Healthy when S3 answers and the bucket exists: the server only logs a failed bucket
    # creation and /healthz answers 200 regardless. Holds on an empty volume only; another
    # STORAGE_BUCKET over an existing bucket keeps it green.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8333/healthz && curl -fsS -o /dev/null -H 'Accept: application/json' http://127.0.0.1:8888/buckets/$${STORAGE_BUCKET}/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # The store as the stand sees it: a TCP forward of S3 (9000) and metrics (9324) into
  # storage-internal. Its health says only that S3 answers through the proxy.
  storage:
    container_name: 'dm-storage'
    # The same reference as the preview edge, so both share one cached image.
    image: 'nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311'
    volumes:
      - ./storage/nginx-stream.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:9000:9000'
    networks:
      - default
      - storage-internal
    depends_on:
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.25'

  # --- Infrastructure: Tracing ---

  # Jaeger v2 (v1 is end of life). Same OTLP ports 4317 and 4318 and UI 16686; the v1 flags
  # are gone in favour of the collector config, and the admin probe moved to 13133.
  jaeger:
    container_name: 'dm-jaeger'
    image: jaegertracing/jaeger:2.20.0
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    # Targeted overrides of the built-in config instead of a copy that would go stale; an
    # unknown key fails the start.
    command:
      # Memory storage is unbounded and the service is limited to 256M: the cap avoids an
      # OOM kill that silently drops every held trace.
      - '--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=10000'
      # The built-in v2 config opens an MCP endpoint on the UI port without authentication.
      - '--set=extensions.jaeger_query.ai.enable_mcp=false'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:13133/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Monitoring ---

  prometheus:
    container_name: 'dm-prometheus'
    image: 'prom/prometheus:v3.13.5'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      # Without a volume the metric history ends with every unit stop.
      - prometheusdata:/prometheus
    # Complete on purpose: command replaces the image CMD, so an omitted flag is a missing setting.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Receives the rules Prometheus evaluates; without it a firing ApiDown is seen only by
  # opening /alerts. Alerts go out over the deployment's own mail transport (Mailpit on a
  # stand, the relay on a server), so there is no token to set.
  alertmanager:
    container_name: 'dm-alertmanager'
    image: 'prom/alertmanager:v0.35.0'
    # Alertmanager expands no environment variables in its config, so the entrypoint renders it first.
    entrypoint: ["/bin/sh", "/alertmanager-init.sh"]
    ports:
      - '127.0.0.1:9093:9093'
    environment:
      # The application's mail path: a relay the API reaches is one its alerts reach.
      ALERT_SMTP_SMARTHOST: ${MAIL_HOST:-dm-mailpit}:${MAIL_PORT:-1025}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      # Mailpit offers STARTTLS only with a certificate the stand lacks, while alertmanager
      # insists on it by default; a relay that wants TLS turns it on.
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-init.sh:/alertmanager-init.sh:ro
      # Silences and the notification log, which otherwise go with every image update and
      # make the stack re-send every firing alert.
      - alertmanagerdata:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  grafana:
    container_name: 'dm-grafana'
    image: 'grafana/grafana:13.3.1'
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: 'dm-pg-exporter'
    environment:
      # pg_monitor only: statistics views, not tables or the server. The maintenance database,
      # because only dm_app may connect to dm3; the series read are server-wide.
      DATA_SOURCE_NAME: "postgresql://dm_exporter:${DM_EXPORTER_PASSWORD}@dm-pg:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: 'dm-node-exporter'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      # Where the nightly backup check leaves its verdict for the textfile collector.
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # --- Application: Migration ---

  migration:
    container_name: 'dm-migration'
    image: ${DM_IMAGE_API:-ghcr.io/dm-am/dm-api:${IMAGE_TAG:-latest}}
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    environment:
      <<: *workload-env
      DM_MigrateOnStart: true
      # A lock the running API holds makes a migration step wait behind it while every request
      # queues behind the step; five seconds fail the step instead, and the release stops there.
      DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=${DB_USER:-dm_app};Password=${DM_APP_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=50;Connection Idle Lifetime=60;Options=-c lock_timeout=5s;${DB_SSL_MODE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Application: Consumers ---

  dm-mail-worker:
    container_name: 'dm-mail-worker'
    image: ${DM_IMAGE_WORKER_MAIL:-ghcr.io/dm-am/dm-worker-mail:${IMAGE_TAG:-latest}}
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.Mail
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    environment:
      <<: *workload-env
      # A pool of its own: one loop claims one row at a time (the budget is at x-workload-env).
      DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=${DB_USER:-dm_app};Password=${DM_APP_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=20;Connection Idle Lifetime=60;${DB_SSL_MODE:-}
    # Longer than the host's 30 seconds of shutdown, so a letter being sent finishes.
    stop_grace_period: 35s
    # Letters wait in the outbox table, so the worker starts once the schema is there.
    depends_on:
      migration:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  dm-notification-worker:
    container_name: 'dm-notification-worker'
    image: ${DM_IMAGE_WORKER_NOTIFICATION:-ghcr.io/dm-am/dm-worker-notification:${IMAGE_TAG:-latest}}
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.NotificationDispatcher
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    environment:
      <<: *workload-env
      # A pool of its own: one loop claims one row at a time (the budget is at x-workload-env).
      DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=${DB_USER:-dm_app};Password=${DM_APP_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=20;Connection Idle Lifetime=60;${DB_SSL_MODE:-}
    # Longer than the host's 30 seconds of shutdown, so an event being dispatched finishes.
    stop_grace_period: 35s
    # Events wait in the outbox table, so the worker starts once the schema is there.
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Application: API ---

  dmapi: &api-service
    container_name: 'dm-api'
    image: ${DM_IMAGE_API:-ghcr.io/dm-am/dm-api:${IMAGE_TAG:-latest}}
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    # Longer than the host's 30 seconds of shutdown, so a request in flight when a rollout
    # stops the old instance completes.
    stop_grace_period: 35s
    ports:
      # Loopback, like every other publication here: a docker-published port bypasses
      # iptables through nat/DOCKER and would expose /v1, /metrics and /_health/detail past basic auth.
      - '127.0.0.1:5000:5000'
    environment: *workload-env
    depends_on:
      migration:
        condition: service_completed_successfully
      # Started, not healthy: without its store the site still serves pages and only uploads
      # fail (ObjectStorageDown says so). The seeder and every --wait gate on seaweedfs health.
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  # The API's twin: it serves alone for the minute a rollout replaces dmapi, so it is dmapi
  # with four differences, which check-compose-topology.sh holds to. No published port, which
  # would collide with the primary's; a profile, so no plain "up" starts it; its own container
  # name; and no periodic job, since one started on both instances runs twice. The restart
  # policy stays, because while it serves alone it is the site.
  dmapi-next:
    <<: *api-service
    container_name: 'dm-api-next'
    ports: []
    environment:
      <<: *workload-env
      DM_PeriodicServices__Enabled: 'false'
    profiles:
      - rollout

  # --- Application: Tools ---

  # Test data seeder. The tools profile keeps it out of a plain up, because it is a
  # one-shot job. Run: docker compose run --rm seeder [all|users|content]
  seeder:
    image: 'dm-seeder:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Tools.Seeder
    # The image entrypoint goes through sh -c and drops arguments, and the seeder command is one.
    entrypoint: ["dotnet", "DM.Tools.Seeder.dll"]
    environment: *workload-env
    depends_on:
      postgres:
        condition: service_healthy
      # The seeder writes pictures, so it waits for a healthy store, which proves the bucket.
      storage:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools
