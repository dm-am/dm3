networks:
  default:
    name: 'dm-full-app'

name: dm

volumes:
  backups:
  pgdata:
  mongodata:
  lokidata:
  miniodata:

# Переменные с дефолтами для локальной разработки
# Для зеркала: переопределить в .env.mirror
x-workload-env: &workload-env
  # === ASP.NET Core ===
  # Production unless explicitly overridden. Development unlocks the dev-only
  # seed and role endpoints, so an unset variable on a server must not be the
  # thing that opens them; docker/.env.example sets Development for local work.
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

  # === Базы данных ===
  DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=postgres;Password=${POSTGRES_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=100;Connection Idle Lifetime=60;${DB_SSL_MODE:-}
  DM_ConnectionStrings__Mongo: mongodb://${MONGO_USER:-dm}:${MONGO_PASSWORD}@${MONGO_HOST:-dm-mongo}:27017/dm3?authSource=dm3&maxPoolSize=1000${MONGO_TLS:-}
  DM_ConnectionStrings__Logs: http://${LOGS_HOST:-dm-loki}:3100
  DM_ConnectionStrings__TracingEndpoint: http://${TRACING_HOST:-dm-jaeger}:4317

  # === Криптография ===
  # Дефолта нет: пустое значение валит старт приложения. Так и задумано - ключ,
  # унаследованный из репозитория, секретом не является. Все зеркала должны
  # получать одно и то же значение, иначе ссылка из письма, выданная одним
  # зеркалом, не расшифруется другим.
  DM_CryptoConfiguration__KeyBase64: ${DM_CryptoConfiguration__KeyBase64:?DM_CryptoConfiguration__KeyBase64 is required, generate with openssl rand -base64 32}

  # === RabbitMQ ===
  DM_RabbitMqConfiguration__Endpoint: amqp://${RABBITMQ_HOST:-dm-rmq}:5672
  DM_RabbitMqConfiguration__VirtualHost: /
  DM_RabbitMqConfiguration__Username: guest
  DM_RabbitMqConfiguration__Password: ${RABBITMQ_DEFAULT_PASS}

  # === CDN (MinIO) ===
  DM_CdnConfiguration__Url: http://${MINIO_HOST:-dm-minio}:9000
  DM_CdnConfiguration__PublicUrl: ${CDN_PUBLIC_URL:-http://localhost:9000}
  DM_CdnConfiguration__Region: us-east-1
  DM_CdnConfiguration__BucketName: dm-uploads
  DM_CdnConfiguration__AccessKey: minio
  DM_CdnConfiguration__SecretKey: ${MINIO_ROOT_PASSWORD}
  DM_CdnConfiguration__Folder:
  DM_CdnConfiguration__Provider: Minio

  # === Image transforms (imgproxy) ===
  # Endpoint = публичный URL imgproxy (фронт обращается напрямую).
  # Key/Salt — HMAC-SHA256 signing для anti-abuse (anyone could otherwise
  # request любой transform и сжечь CPU).
  DM_ImageProxyConfiguration__Endpoint: ${IMGPROXY_PUBLIC_URL:-http://localhost:8080}
  DM_ImageProxyConfiguration__Key: ${IMGPROXY_KEY}
  DM_ImageProxyConfiguration__Salt: ${IMGPROXY_SALT}
  DM_ImageProxyConfiguration__SourceUrlPrefix: s3://dm-uploads/

  # === Email ===
  DM_EmailConfiguration__ServerHost: ${MAIL_HOST:-dm-mailhog}
  DM_EmailConfiguration__ServerPort: ${MAIL_PORT:-1025}
  DM_EmailConfiguration__Username:
  DM_EmailConfiguration__Password:
  DM_EmailConfiguration__FromAddress: info@dm.am
  DM_EmailConfiguration__FromDisplayName: DM.am
  DM_EmailConfiguration__ReplyToAddress: test@dm.am

  # === Интеграция ===
  DM_IntegrationSettings__WebUrl: ${WEB_URL:-http://localhost:5173}
  DM_IntegrationSettings__ApiUrl: ${API_URL:-http://localhost:5000}
  DM_IntegrationSettings__AdminUrl:
  DM_IntegrationSettings__MobileUrl:
  DM_IntegrationSettings__CorsUrls__0: ${CORS_URL_0:-http://localhost:5173}
  DM_IntegrationSettings__CorsUrls__1: ${CORS_URL_1:-http://localhost:8080}
  DM_IntegrationSettings__StaticAssetsUrl: ${STATIC_ASSETS_URL:-http://localhost:9000/dm-uploads}

  # === Зеркало ===
  DM_MirrorConfiguration__CurrentMirrorId: ${MIRROR_ID:-main}

x-docker-context: &docker-context
  context: ./..
  dockerfile: ./docker/app.Dockerfile

services:
  # --- Infrastructure: Databases ---

  postgres:
    container_name: 'dm-pg'
    image: 'postgres:16'
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/var/backups
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dm3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  mongo:
    container_name: 'dm-mongo'
    image: 'mongo:7'
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      # Authentication is on. The store holds sessions, the security audit log
      # and login attempts: without it everything on the compose network reads
      # and writes all of that with no credential at all.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: dm3
      # Consumed by mongo-init.js to create the least-privilege application user
      DM_MONGO_USER: ${MONGO_USER:-dm}
      DM_MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongodata:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER:-root}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  loki:
    container_name: 'dm-loki'
    image: 'grafana/loki:3.1.1'
    command: '-config.file=/etc/loki/loki.yaml'
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Message Broker ---

  rabbitmq:
    container_name: 'dm-rmq'
    image: 'rabbitmq:3-management'
    hostname: 'dm-rmq'
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # --- Infrastructure: Dev Tools ---

  mailhog:
    container_name: 'dm-mailhog'
    image: 'mailhog/mailhog'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Infrastructure: Object Storage ---

  minio:
    container_name: 'dm-minio'
    image: 'quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z'
    command: server --console-address ':9001' /data/
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: 'minio'
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: 'us-east-1'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Image transforms (imgproxy) ---
  # On-the-fly resize + format negotiation (AVIF/WebP/JPEG via Accept header).
  # Reads from MinIO via S3 protocol, серверу аватаров достаточно хранить
  # один source-file на upload — все thumbs генерируются по требованию.
  imgproxy:
    container_name: 'dm-imgproxy'
    image: 'darthsim/imgproxy:v3.27'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      # S3 source — читаем напрямую из MinIO, без HTTP-роундтрипа.
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: 'http://dm-minio:9000'
      IMGPROXY_S3_REGION: 'us-east-1'
      IMGPROXY_S3_BUCKET_LOOKUP_TYPE: 'force-path-style'
      AWS_ACCESS_KEY_ID: 'minio'
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Format negotiation via Accept header.
      IMGPROXY_AUTO_WEBP: 'true'
      IMGPROXY_AUTO_AVIF: 'true'
      # Anti-abuse: max input size 10 MB, max output dimensions 2048×2048.
      IMGPROXY_MAX_SRC_RESOLUTION: '50'      # MP
      IMGPROXY_MAX_SRC_FILE_SIZE: '10485760' # bytes = 10 MB
      # Output cache hints — фронтенд + CDN кешируют immutable.
      IMGPROXY_TTL: '31536000'
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # --- Infrastructure: Tracing ---

  jaeger:
    container_name: 'dm-jaeger'
    image: jaegertracing/all-in-one:1.56
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Monitoring ---

  prometheus:
    container_name: 'dm-prometheus'
    image: 'prom/prometheus:v2.51.0'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  grafana:
    container_name: 'dm-grafana'
    image: 'grafana/grafana:10.4.0'
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: 'dm-pg-exporter'
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@dm-pg:5432/dm3?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: 'dm-node-exporter'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # --- Application: Migration ---

  migration:
    container_name: 'dm-migration'
    image: 'dm-api:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
    environment:
      <<: *workload-env
      DM_MigrateOnStart: true
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # --- Application: Consumers ---

  dm-mail-worker:
    container_name: 'dm-mail-worker'
    image: 'dm-worker-mail:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.Mail
    ports:
      - '127.0.0.1:5003:5000'
    environment: *workload-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  dm-notification-worker:
    container_name: 'dm-notification-worker'
    image: 'dm-worker-notification:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.NotificationDispatcher
    ports:
      - '127.0.0.1:5002:5000'
    environment: *workload-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Application: API ---

  dmapi:
    container_name: 'dm-api'
    image: ${API_IMAGE:-ghcr.io/dm-am/dm-api:latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
    ports:
      - '5000:5000'
    environment: *workload-env
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  # --- Application: Tools ---

  # Сидер тестовых данных. Профиль "tools" держит его в стороне от обычного
  # docker compose up: это разовая задача, а не сервис.
  # Запуск: docker compose run --rm seeder [all|users|content]
  seeder:
    image: 'dm-seeder:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Tools.Seeder
    # Entrypoint образа запускает приложение через sh -c и аргументы до него не
    # доходят, а команда сидера передается именно аргументом.
    entrypoint: ["dotnet", "DM.Tools.Seeder.dll"]
    environment: *workload-env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  # --- Infrastructure: Auto-update ---

  watchtower:
    container_name: 'dm-watchtower'
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: 300  # проверка каждые 5 минут
      WATCHTOWER_LABEL_ENABLE: 'true'  # обновлять только с label
    restart: unless-stopped
    profiles:
      - production
      - mirror
