networks:
  default:
    name: 'dm-full-app'
    # Заданная подсеть, а не выданная Docker из пула. Она — то, что API считает
    # доверенным источником X-Forwarded-For, поэтому значение должно быть
    # известно заранее и совпадать с DM_ReverseProxyConfiguration__TrustedNetworks
    # в docker-compose.preview.yml. Проверяется тестом DeploymentConfigurationShould.
    ipam:
      config:
        - subnet: '172.28.0.0/16'

name: dm

volumes:
  pgdata:
  mongodata:
  lokidata:
  miniodata:
  rmqdata:
  alertmanagerdata:

# Переменные с дефолтами для локальной разработки.
# Точка присутствия свой набор переопределяет в .env.mirror — секретов там нет.
x-workload-env: &workload-env
  # === ASP.NET Core ===
  # Production unless explicitly overridden. Development is what maps Swagger UI
  # and relaxes the script CSP for it, so an unset variable on a server must not
  # be the thing that publishes the API documentation; docker/.env.example sets
  # Development for local work. There are no environment-gated seed or role
  # endpoints: seeding is a separate tool and the role endpoint is closed by
  # RequireRole(Admin).
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

  # === Базы данных ===
  DM_ConnectionStrings__Rdb: Host=${DB_HOST:-dm-pg};Port=5432;User ID=postgres;Password=${POSTGRES_PASSWORD};Database=dm3;Pooling=true;MinPoolSize=0;MaxPoolSize=100;Connection Idle Lifetime=60;${DB_SSL_MODE:-}
  DM_ConnectionStrings__Mongo: mongodb://${MONGO_USER:-dm}:${MONGO_PASSWORD}@${MONGO_HOST:-dm-mongo}:27017/dm3?authSource=dm3&maxPoolSize=1000${MONGO_TLS:-}
  DM_ConnectionStrings__Logs: http://${LOGS_HOST:-dm-loki}:3100
  DM_ConnectionStrings__TracingEndpoint: http://${TRACING_HOST:-dm-jaeger}:4317

  # === Криптография ===
  # Дефолта нет: пустое значение валит старт приложения. Так и задумано - ключ,
  # унаследованный из репозитория, секретом не является. Экземпляр приложения
  # один, и ключ живет только на нем: точка присутствия кода приложения не
  # выполняет, шифровать ей нечего, и копия ключа на ней отменяет весь смысл
  # схемы.
  DM_CryptoConfiguration__KeyBase64: ${DM_CryptoConfiguration__KeyBase64:?DM_CryptoConfiguration__KeyBase64 is required, generate with openssl rand -base64 32}

  # === RabbitMQ ===
  DM_RabbitMqConfiguration__Endpoint: amqp://${RABBITMQ_HOST:-dm-rmq}:5672
  DM_RabbitMqConfiguration__VirtualHost: /
  DM_RabbitMqConfiguration__Username: guest
  DM_RabbitMqConfiguration__Password: ${RABBITMQ_DEFAULT_PASS}

  # === CDN (MinIO) ===
  DM_CdnConfiguration__Url: http://${MINIO_HOST:-dm-minio}:9000
  DM_CdnConfiguration__PublicUrl: ${CDN_PUBLIC_URL:-http://localhost:9000}
  DM_CdnConfiguration__Region: us-east-1
  DM_CdnConfiguration__BucketName: dm-uploads
  # Service account scoped to one bucket, not root. Object storage holds the
  # only data nothing else can rebuild, and any leak of a workload's
  # configuration used to hand over administration of the store: dropping the
  # bucket, rewriting its policy, minting further accounts. Created by
  # minio-init, the way mongo-init.js creates the Mongo application user.
  DM_CdnConfiguration__AccessKey: ${MINIO_APP_USER:-dm-app}
  DM_CdnConfiguration__SecretKey: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
  DM_CdnConfiguration__Folder:
  DM_CdnConfiguration__Provider: Minio

  # === Image transforms (imgproxy) ===
  # Endpoint = публичный URL imgproxy (фронт обращается напрямую).
  # Key/Salt — HMAC-SHA256 signing для anti-abuse (anyone could otherwise
  # request любой transform и сжечь CPU). Дефолта у пары нет по той же причине,
  # что и у крипто-ключа выше: подпись, унаследованная из репозитория, не
  # защищает ни от чего. Пустое значение валит интерполяцию, а не всплывает
  # первой миниатюрой, подписанной словом insecure.
  DM_ImageProxyConfiguration__Endpoint: ${IMGPROXY_PUBLIC_URL:-http://localhost:8080}
  DM_ImageProxyConfiguration__Key: ${IMGPROXY_KEY:?IMGPROXY_KEY is required, generate with openssl rand -hex 32}
  DM_ImageProxyConfiguration__Salt: ${IMGPROXY_SALT:?IMGPROXY_SALT is required, generate with openssl rand -hex 32}
  DM_ImageProxyConfiguration__SourceUrlPrefix: s3://dm-uploads/

  # === Email ===
  DM_EmailConfiguration__ServerHost: ${MAIL_HOST:-dm-mailhog}
  DM_EmailConfiguration__ServerPort: ${MAIL_PORT:-1025}
  DM_EmailConfiguration__Username:
  DM_EmailConfiguration__Password:
  DM_EmailConfiguration__FromAddress: info@dm.am
  DM_EmailConfiguration__FromDisplayName: DM.am
  DM_EmailConfiguration__ReplyToAddress: test@dm.am
  # Оппортунистический STARTTLS по умолчанию: relay на стенде — это MailHog, и
  # шифрования он не предлагает вовсе. Развертывание с настоящим relay ставит
  # true, и тогда сессия падает вместо тихой отправки открытым текстом: в
  # письмах ездят ссылки активации и сброса пароля.
  DM_EmailConfiguration__RequireTls: ${MAIL_REQUIRE_TLS:-false}

  # Область сессионной куки. Пусто — кука принадлежит хосту, который ее выдал,
  # и вход на каждом адресе свой. Регистрируемый домен — один вход на все
  # адреса; включать только когда каждый хост этого домена принадлежит нам.
  DM_SessionCookieConfiguration__Domain: ${SESSION_COOKIE_DOMAIN:-}

  # === Адреса сайта ===
  # PublicUrl — адрес, которым это развертывание называет само себя: из него
  # собираются все ссылки в письмах. AllowedOrigins читают и политика CORS, и
  # проверка Origin вместо CSRF-токена, поэтому список один.
  # Перечень адресов сайта (Addresses) живет в appsettings.json: он меняется
  # раз в несколько лет и одинаков для всех развертываний.
  DM_SiteAddressConfiguration__PublicUrl: ${WEB_URL:-http://localhost:5173}
  DM_SiteAddressConfiguration__AllowedOrigins__0: ${CORS_URL_0:-http://localhost:5173}
  DM_SiteAddressConfiguration__AllowedOrigins__1: ${CORS_URL_1:-http://localhost:8080}

# Build context shared by every image this repository produces. CI builds them
# and pushes them under one tag per run, which is why all four image references
# below read IMAGE_TAG: they come from a single commit and there is nothing to
# pin apart. Nothing in the deployment path passes --build, so the server pulls
# what was published and compose falls back to building only when the registry
# cannot be reached. Rolling a stand back is IMAGE_TAG in .env set to the short
# sha of an earlier run.
x-docker-context: &docker-context
  context: ./..
  dockerfile: ./docker/app.Dockerfile

services:
  # --- Infrastructure: Databases ---

  postgres:
    container_name: 'dm-pg'
    image: 'postgres:16'
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dm3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  mongo:
    container_name: 'dm-mongo'
    image: 'mongo:7'
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      # Authentication is on. The store holds sessions, the security audit log
      # and login attempts: without it everything on the compose network reads
      # and writes all of that with no credential at all.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: dm3
      # Consumed by mongo-init.js to create the least-privilege application user
      DM_MONGO_USER: ${MONGO_USER:-dm}
      DM_MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongodata:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER:-root}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  loki:
    container_name: 'dm-loki'
    image: 'grafana/loki:3.1.1'
    command: '-config.file=/etc/loki/loki.yaml'
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Message Broker ---

  rabbitmq:
    container_name: 'dm-rmq'
    image: 'rabbitmq:3-management'
    hostname: 'dm-rmq'
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
      # Metrics endpoint of rabbitmq_prometheus. Everything that says whether the
      # bus is moving - depth of a queue, a dead-letter queue that stopped being
      # empty, a queue left with no consumer - is visible only here: the workers
      # publish nothing about the broker, and a consumer that silently stopped
      # looks from their side exactly like an idle one.
      - '127.0.0.1:15692:15692'
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      # The metrics plugin is not on by default, and the default endpoint
      # aggregates across every queue - an aggregate cannot name the queue that
      # is backing up, which is the whole point of scraping it.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/dm.conf:/etc/rabbitmq/conf.d/10-dm.conf:ro
      # The one stateful service that had no volume of its own. The queues here
      # are declared durable, but the directory holding them lived in the
      # container layer, so recreating the container - an image update, a changed
      # limit - took the unsent mail and the dead-letter queue with it. The node
      # name is pinned by the hostname above: mnesia stores its data under a
      # directory named after the node, and a generated hostname would leave the
      # next container looking at an empty one.
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # --- Infrastructure: Dev Tools ---

  mailhog:
    container_name: 'dm-mailhog'
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Infrastructure: Object Storage ---

  minio:
    container_name: 'dm-minio'
    image: 'quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z'
    command: server --console-address ':9001' /data/
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: 'minio'
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: 'us-east-1'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Bootstrap of the object store: root creates the bucket and the two scoped
  # accounts here and is then out of the picture. Runs before anything that
  # touches a bucket, and the workloads wait for it to succeed.
  minio-init:
    container_name: 'dm-minio-init'
    # Unpinned like the image backup-minio.sh runs: mc talks to the server over
    # its admin API, and the two are released together.
    image: 'minio/mc'
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      MINIO_ENDPOINT: http://${MINIO_HOST:-dm-minio}:9000
      BUCKET_NAME: dm-uploads
      MINIO_ROOT_USER: 'minio'
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:-dm-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_IMGPROXY_USER: ${MINIO_IMGPROXY_USER:-dm-imgproxy}
      MINIO_IMGPROXY_PASSWORD: ${MINIO_IMGPROXY_PASSWORD:?MINIO_IMGPROXY_PASSWORD is required}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # --- Infrastructure: Image transforms (imgproxy) ---
  # On-the-fly resize + format negotiation (AVIF/WebP/JPEG via Accept header).
  # Reads from MinIO via S3 protocol, серверу аватаров достаточно хранить
  # один source-file на upload — все thumbs генерируются по требованию.
  imgproxy:
    container_name: 'dm-imgproxy'
    image: 'darthsim/imgproxy:v3.27'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?IMGPROXY_KEY is required, generate with openssl rand -hex 32}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?IMGPROXY_SALT is required, generate with openssl rand -hex 32}
      # S3 source — читаем напрямую из MinIO, без HTTP-роундтрипа.
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: 'http://dm-minio:9000'
      IMGPROXY_S3_REGION: 'us-east-1'
      IMGPROXY_S3_BUCKET_LOOKUP_TYPE: 'force-path-style'
      # Read-only service account: imgproxy never writes to the bucket, and it
      # is the container that parses untrusted image data.
      AWS_ACCESS_KEY_ID: ${MINIO_IMGPROXY_USER:-dm-imgproxy}
      AWS_SECRET_ACCESS_KEY: ${MINIO_IMGPROXY_PASSWORD:?MINIO_IMGPROXY_PASSWORD is required}
      # Format negotiation via Accept header.
      IMGPROXY_AUTO_WEBP: 'true'
      IMGPROXY_AUTO_AVIF: 'true'
      # Anti-abuse: max input size 10 MB, max output dimensions 2048×2048.
      IMGPROXY_MAX_SRC_RESOLUTION: '50'      # MP
      IMGPROXY_MAX_SRC_FILE_SIZE: '10485760' # bytes = 10 MB
      # Output cache hints — фронтенд + CDN кешируют immutable.
      IMGPROXY_TTL: '31536000'
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # --- Infrastructure: Tracing ---

  jaeger:
    container_name: 'dm-jaeger'
    image: jaegertracing/all-in-one:1.56
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Monitoring ---

  prometheus:
    container_name: 'dm-prometheus'
    image: 'prom/prometheus:v2.51.0'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # The receiver of the rules Prometheus evaluates. Without it the whole rule set
  # reached a firing state inside Prometheus and stopped there: finding out that
  # ApiDown had fired took opening /alerts through a tunnel, which takes already
  # suspecting the site is down.
  #
  # No secret of its own. Alerts go out over the mail transport the deployment
  # already has - MAIL_HOST is MailHog on a stand and the relay on a server - so
  # an alert arrives wherever registration mail arrives, and there is no token to
  # paste before delivery starts working.
  alertmanager:
    container_name: 'dm-alertmanager'
    image: 'prom/alertmanager:v0.27.0'
    # Alertmanager expands no environment variable in its configuration file, so
    # the entrypoint renders one from the environment first. Everything below
    # would otherwise have to be a literal in the repository.
    entrypoint: ["/bin/sh", "/alertmanager-init.sh"]
    ports:
      - '127.0.0.1:9093:9093'
    environment:
      # The mail path of the application, not a second one: a relay reachable by
      # the API is a relay reachable by the alerts about the API.
      ALERT_SMTP_SMARTHOST: ${MAIL_HOST:-dm-mailhog}:${MAIL_PORT:-1025}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      # MailHog offers no STARTTLS and alertmanager insists on it by default, so
      # the stand default is off and a relay that wants TLS turns it on.
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alertmanager@dm.am}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@dm.am}
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-init.sh:/alertmanager-init.sh:ro
      # Silences and the notification log. In the container layer they went with
      # every image update: the stack would then re-send every firing alert and
      # forget the silence set on the incident being worked on.
      - alertmanagerdata:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  grafana:
    container_name: 'dm-grafana'
    image: 'grafana/grafana:10.4.0'
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Infrastructure: Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: 'dm-pg-exporter'
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@dm-pg:5432/dm3?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: 'dm-node-exporter'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      # Where the nightly backup check leaves its verdict. Without a collector
      # reading it, that verdict was an exit code going into a log file and into
      # mail on a machine with no MTA.
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # --- Application: Migration ---

  migration:
    container_name: 'dm-migration'
    image: ghcr.io/dm-am/dm-api:${IMAGE_TAG:-latest}
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
    environment:
      <<: *workload-env
      DM_MigrateOnStart: true
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # --- Application: Consumers ---

  dm-mail-worker:
    container_name: 'dm-mail-worker'
    image: ghcr.io/dm-am/dm-worker-mail:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.Mail
    ports:
      - '127.0.0.1:5003:5000'
    environment: *workload-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  dm-notification-worker:
    container_name: 'dm-notification-worker'
    image: ghcr.io/dm-am/dm-worker-notification:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Workers.NotificationDispatcher
    ports:
      - '127.0.0.1:5002:5000'
    environment: *workload-env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # --- Application: API ---

  dmapi:
    container_name: 'dm-api'
    image: ghcr.io/dm-am/dm-api:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Web.API
    ports:
      # Привязка к loopback, как у всех остальных семнадцати публикаций в этом
      # файле. Без нее порт слушал 0.0.0.0, а опубликованный docker-ом порт идет
      # через цепочки nat/DOCKER мимо INPUT, то есть мимо iptables из
      # setup-server.sh. На preview-стенде это открывало весь /v1/**, /metrics и
      # /_health/detail в интернет в обход basic auth: nginx закрывал только
      # порт 80, то есть SPA, а не данные. Локальной разработке loopback-а
      # достаточно, а nginx ходит к API по имени сервиса внутри сети.
      - '127.0.0.1:5000:5000'
    environment: *workload-env
    depends_on:
      migration:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/_health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  # --- Application: Tools ---

  # Сидер тестовых данных. Профиль "tools" держит его в стороне от обычного
  # docker compose up: это разовая задача, а не сервис.
  # Запуск: docker compose run --rm seeder [all|users|content]
  seeder:
    image: 'dm-seeder:local'
    build:
      <<: *docker-context
      args:
        PROJECT_NAME: DM.Tools.Seeder
    # Entrypoint образа запускает приложение через sh -c и аргументы до него не
    # доходят, а команда сидера передается именно аргументом.
    entrypoint: ["dotnet", "DM.Tools.Seeder.dll"]
    environment: *workload-env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - tools

  # --- Infrastructure: Auto-update ---

  # Started by the profile setup-server.sh and dm3.service pass, and by the
  # mirror command for a mirror. Nothing passed a profile before, so the service
  # the guides call the update mechanism was declared and never run. It restarts
  # only containers carrying the watchtower label, and the one-shot migration
  # deliberately has none: a release that changes the schema is a restart of the
  # unit, not a container swap.
  watchtower:
    container_name: 'dm-watchtower'
    image: containrrr/watchtower:1.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: 300  # проверка каждые 5 минут
      WATCHTOWER_LABEL_ENABLE: 'true'  # обновлять только с label
    restart: unless-stopped
    profiles:
      - production
      - mirror
