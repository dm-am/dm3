# Preview deployment with nginx basic auth
# Usage:
#   1. Generate password: docker run --rm httpd htpasswd -nb preview yourpassword > docker/nginx/.htpasswd
#   2. Run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.preview.yml up -d

networks:
  default:
    name: 'dm-full-app'

services:
  nginx:
    container_name: 'dm-nginx'
    image: 'nginx:alpine'
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      dmapi:
        condition: service_healthy
      dmfront:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  dmapi:
    environment:
      DM_CdnConfiguration__PublicUrl: ""

  dmfront:
    container_name: 'dm-front'
    # Same shape as dmapi: pull the published image by default, build only when
    # FRONT_IMAGE names a local tag. Publishing an image that no deployment ever
    # pulls is how the API image went unused for months.
    image: ${FRONT_IMAGE:-ghcr.io/dm-am/dm-front:latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build:
      context: ../src/DM.Web.Client
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the SPA calls relative URLs and nginx routes them to
        # the API. The name must match the ARG the Dockerfile declares — the
        # previous VITE_API_URL was declared nowhere and silently did nothing.
        VITE_API_HOST: ""
    depends_on:
      dmapi:
        condition: service_healthy
