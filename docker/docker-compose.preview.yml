# Preview deployment with nginx basic auth
# Usage:
#   1. Generate the credentials: bash docker/scripts/init-htpasswd.sh
#      Without that file docker creates a directory in its place and nginx does not start.
#   2. Run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.preview.yml up -d

networks:
  default:
    name: 'dm-full-app'

volumes:
  geodata:
  # The hashed bundle both frontends of a rollout publish into and serve from, so a document
  # of either one finds its chunks (publish-assets.sh in the frontend image).
  frontassets:

services:
  nginx:
    container_name: 'dm-nginx'
    # Tag and digest: the edge changes only by maintenance, and a rewritten tag would change
    # it under a release. Dependabot's docker-compose entry moves the pin.
    image: 'nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311'
    # The edge resolves the name of every container behind it at parse time, so a container
    # replaced outside a rollout returns on a new address and every request is a 502 until
    # the edge is reloaded or recreated (DEPLOYMENT.md, "Край держит адреса с момента старта").
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/edge-locations.conf:/etc/nginx/edge-locations.conf:ro
      # One file per instance behind the edge; the command below links the live pair.
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
      # The machine files: docker/nginx from a checkout, shared/edge beside the releases on a
      # server, where the release's compose command line exports DM_EDGE_DIR after sourcing
      # docker/scripts/_paths.sh. A release directory is read-only and replaced by the next
      # one, and shared/env stays without it, since the path follows from the layout.
      - ${DM_EDGE_DIR:-./nginx}/.htpasswd:/etc/nginx/.htpasswd:ro
      # Empty until the first certificate, which is a working state: the edge serves http
      # until it has https to serve. docker/scripts/init-ssl.sh puts the TLS server and the
      # redirect here.
      - ${DM_EDGE_DIR:-./nginx}/tls:/etc/nginx/tls:ro
      - ${DM_EDGE_DIR:-./nginx}/acme:/var/www/certbot:ro
      - ${SSL_ROOT:-/etc/letsencrypt}:/etc/nginx/ssl:ro
    depends_on:
      dmapi:
        condition: service_healthy
      dmfront:
        condition: service_started
    # Links the primaries, then hands over to the image's own start. Written here rather than
    # in a hook file, so there is no file mode to lose on a Windows checkout. It runs again on
    # every restart, so an edge that restarts in the middle of a rollout serves the primaries.
    # A switch sets both links in the container, runs nginx -t and reloads.
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/nginx/upstreams-live
        ln -sfn /etc/nginx/upstreams/api-primary.conf /etc/nginx/upstreams-live/api.conf
        ln -sfn /etc/nginx/upstreams/front-primary.conf /etc/nginx/upstreams-live/frontend.conf
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # The twin of a rollout stands behind the same edge, so it takes the same keys.
  dmapi: &edge-api
    environment:
      DM_CdnConfiguration__PublicUrl: ""

      # The only place where nginx stands before the API, so the only one where forwarded
      # headers can be trusted. Without them every request comes from the nginx container's
      # address: the 100 requests a minute limiter becomes one budget for the site and the
      # login log writes one address. The trusted network is dm-full-app from
      # docker-compose.yml, not loopback.
      DM_ReverseProxyConfiguration__TrustedNetworks__0: '172.28.0.0/16'
      DM_ReverseProxyConfiguration__ProxyCount: '1'

      # The country table the sign-in letter names a country by (CONFIGURATION.md). The API
      # downloads it when it is missing and weekly. A named volume, because docker hands the
      # ownership of the image's /data/geo to a new volume, so the API can write there
      # whatever the uid of the operator is.
      DM_GeoLocationConfiguration__CountryDatabasePath: '/data/geo/ip-country.csv'
    volumes:
      - geodata:/data/geo

  dmapi-next: *edge-api

  dmfront: &front-service
    container_name: 'dm-front'
    # Same shape as dmapi: the image CI published, under the tag IMAGE_TAG names, or the
    # digest a release names.
    image: ${DM_IMAGE_FRONT:-ghcr.io/dm-am/dm-front:${IMAGE_TAG:-latest}}
    build:
      context: ../src/DM.Web.Client
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the SPA calls relative URLs and nginx routes them. Must match
        # the ARG the Dockerfile declares.
        VITE_API_HOST: ""
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    volumes:
      - frontassets:/var/lib/dm-front/assets
    depends_on:
      dmapi:
        condition: service_healthy
    # The document, which the image always carries: the gates of a rollout wait for it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The frontend's twin, the same as dmfront but for its name and a profile, so no plain
  # "up" starts it.
  dmfront-next:
    <<: *front-service
    container_name: 'dm-front-next'
    profiles:
      - rollout
