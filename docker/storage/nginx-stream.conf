# The only door from the stand network into the object store.
#
# SeaweedFS runs in an internal network of its own, for the reason written at
# storage-internal in docker-compose.yml. This proxy sits in both networks and forwards two TCP ports, S3 and metrics,
# and nothing else: it checks no right, SeaweedFS does that on every request.
#
# The upstream is resolved through Docker's DNS on every connection, with the
# answer kept for ten seconds, rather than once at start-up: a recreated
# seaweedfs container comes back on another address, and a name fixed at start
# would keep forwarding to the old one.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 9000;
        set $s3 seaweedfs:8333;
        proxy_pass $s3;
    }

    server {
        listen 9324;
        set $metrics seaweedfs:9324;
        proxy_pass $metrics;
    }
}
