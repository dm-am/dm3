# Unit-тесты правил алертинга (promtool test rules).
#
# promtool check config разбирает синтаксис и молчит о смысле: выражение,
# читающее не ту серию, парсится ровно так же, как правильное. Здесь правило
# прогоняется по заданному ряду и проверяется, что оно срабатывает именно на том
# состоянии, ради которого написано.
#
# Не полный набор. Правила, срабатывающие на up == 0 и absent(), проверяются
# самим наличием цели в prometheus.yml — их дублирование здесь ничего не ловит.
# Сюда попадает то, где выражение можно написать синтаксически верно и по смыслу
# мимо: суммы по нескольким сериям и разрезы по меткам. ApiDown теперь берет
# максимум по экземплярам API, это уже свертка нескольких серий, и он проверяется здесь.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Слушатель живых уведомлений, который пять минут подряд не слушает: правило
  # срабатывает на экземпляр. Рядом экземпляр, который слушает, и он молчит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_push_listening{job="dm-api",instance="dm-api-1:8080"}'
        values: '0+0x10'
      - series: 'dm_messaging_push_listening{job="dm-api",instance="dm-api-2:8080"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RealtimePushNotListening
        exp_alerts: []
      - eval_time: 6m
        alertname: RealtimePushNotListening
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dm-api
              instance: dm-api-1:8080
            exp_annotations:
              summary: "API dm-api-1:8080 не слушает живые уведомления"
              description: "Пять минут экземпляр API не слушает канал уведомлений в базе, поэтому живые уведомления в его вкладки не приходят. Сами уведомления сохранены и читаются запросом. Смотреть docker logs dm-api и строку realtime-push в /_health/detail."

  # Возраст очереди разрезается по очереди: застрявшая почта поднимает алерт
  # про почту, а пустая очередь уведомлений рядом молчит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_lag_seconds{queue="dm.mail.sending"}'
        values: '600+60x15'
      - series: 'dm_messaging_outbox_lag_seconds{queue="dm.notifications"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: OutboxBacklogAging
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "Записи застряли в очереди dm.mail.sending"
              description: "Самая старая ожидающая запись очереди ждет больше 5 минут, уведомления, письма и счетчики по ней не уходят. Ничего не потеряно, записи ждут обработки. Смотреть поля Attempts и LastError у старых записей в базе и docker logs обработчика очереди."

  # Мертвая запись поднимает алерт своей очереди, если живет пять минут. Рядом
  # очередь без мертвых записей, и она молчит. Вторая очередь показывает, что
  # правило не привязано к одной.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{queue="dm.mail.sending"}'
        values: '0+0x2 1+0x10'
      - series: 'dm_messaging_outbox_dead{queue="dm.notifications"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts: []
      - eval_time: 9m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "В очереди dm.mail.sending есть мертвые записи"
              description: 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'

  # Мертвая запись события поднимает тот же алерт под своей очередью, а запись,
  # которую вернули или удалили, его гасит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{queue="dm.notifications"}'
        values: '2+0x7 0+0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.notifications
            exp_annotations:
              summary: "В очереди dm.notifications есть мертвые записи"
              description: 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'
      - eval_time: 10m
        alertname: DeadOutboxRows
        exp_alerts: []

  # Каждый экземпляр API читает одну и ту же таблицу, поэтому два экземпляра
  # дают одну мертвую запись дважды. Алерт один на очередь и без instance: по
  # сырому датчику их было бы два, каждый со своим instance.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-1:8080",queue="dm.notifications"}'
        values: '1+0x10'
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-2:8080",queue="dm.notifications"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.notifications
            exp_annotations:
              summary: "В очереди dm.notifications есть мертвые записи"
              description: &dead-description 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'

  # Релиз сменяет экземпляр: первый пропадает после 6m, второй читает ту же
  # таблицу с 5m. Алерт горит без перерыва. По сырому датчику алерт первого
  # погас бы в 7m, а алерт второго ждал бы своих пяти минут до 10m, и в 8m не
  # горело бы ничего.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-1:8080",queue="dm.notifications"}'
        values: '1+0x6 stale'
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-2:8080",queue="dm.notifications"}'
        values: '_x5 1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.notifications
            exp_annotations:
              summary: "В очереди dm.notifications есть мертвые записи"
              description: *dead-description

  # Неудачное чтение дает NaN по каждой очереди (QueueMetrics). max пропускает
  # NaN, пока есть число: экземпляр, не прочитавший базу, не гасит алерт
  # соседа. По сырому датчику алерт был бы, но с instance.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-1:8080",queue="dm.notifications"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN'
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-2:8080",queue="dm.notifications"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.notifications
            exp_annotations:
              summary: "В очереди dm.notifications есть мертвые записи"
              description: *dead-description

  # Если базу не прочитал ни один экземпляр, max дает NaN, и правило молчит:
  # это забота правил о базе, а не о мертвых записях.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-1:8080",queue="dm.notifications"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN'
      - series: 'dm_messaging_outbox_dead{job="dm-api",instance="dm-api-2:8080",queue="dm.notifications"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts: []

  # Возраст очереди с двух экземпляров: один алерт на очередь и без instance.
  # По сырому датчику их было бы два.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_lag_seconds{job="dm-api",instance="dm-api-1:8080",queue="dm.mail.sending"}'
        values: '600+0x10'
      - series: 'dm_messaging_outbox_lag_seconds{job="dm-api",instance="dm-api-2:8080",queue="dm.mail.sending"}'
        values: '600+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: OutboxBacklogAging
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "Записи застряли в очереди dm.mail.sending"
              description: &lag-description "Самая старая ожидающая запись очереди ждет больше 5 минут, уведомления, письма и счетчики по ней не уходят. Ничего не потеряно, записи ждут обработки. Смотреть поля Attempts и LastError у старых записей в базе и docker logs обработчика очереди."

  # Смена экземпляра при релизе не гасит и не поднимает заново алерт о возрасте.
  # По сырому датчику в 8m не горело бы ничего, как у мертвых записей выше.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_lag_seconds{job="dm-api",instance="dm-api-1:8080",queue="dm.mail.sending"}'
        values: '600+0x6 stale'
      - series: 'dm_messaging_outbox_lag_seconds{job="dm-api",instance="dm-api-2:8080",queue="dm.mail.sending"}'
        values: '_x5 600+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: OutboxBacklogAging
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "Записи застряли в очереди dm.mail.sending"
              description: *lag-description

  # Между релизами второй экземпляр API лежит, а первый отвечает: сайт
  # работает, и ApiDown молчит. По сырому up алерт о втором поднялся бы через
  # минуту.
  - interval: 1m
    input_series:
      - series: 'up{job="dm-api",instance="dm-api-1:8080"}'
        values: '1+0x5'
      - series: 'up{job="dm-api",instance="dm-api-2:8080"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiDown
        exp_alerts: []

  # Лежат оба: один алерт без instance. По сырому up их было бы два.
  - interval: 1m
    input_series:
      - series: 'up{job="dm-api",instance="dm-api-1:8080"}'
        values: '0+0x2'
      - series: 'up{job="dm-api",instance="dm-api-2:8080"}'
        values: '0+0x2'
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "API DM не отвечает"
              description: "Prometheus больше минуты не может опросить dm-api, сайт, скорее всего, недоступен. Запросы пользователей заканчиваются ошибкой или не доходят. Смотреть docker ps и docker logs dm-api."

  # Один и тот же вопрос без обработчика на двух экземплярах: один алерт на
  # пару intention и target. По сырому счетчику их было бы два, каждый с instance.
  - interval: 1m
    input_series:
      - series: 'dm_authorization_resolver_missing_total{job="dm-api",instance="dm-api-1:8080",intention="ReadTopic",target="Topic"}'
        values: '0+1x10'
      - series: 'dm_authorization_resolver_missing_total{job="dm-api",instance="dm-api-2:8080",intention="ReadTopic",target="Topic"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: AuthorizationResolverMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              intention: ReadTopic
              target: Topic
            exp_annotations:
              summary: "Вопрос о правах не дошел до обработчика"
              description: "ReadTopic для Topic отклоняется потому, что на вопрос о правах никто не отвечает, а не потому, что правила запрещают. Пользователь видит отказ в том, что ему разрешено. Смотреть docker logs dm-api."

  # Отказы доставки разрезаются по каналу: одно правило на все каналы назвало бы
  # в письме "channel" пустым, и получатель не узнал бы, какой из них лежит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_delivery_failed_total{channel="email",event="NewTopic"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeliveriesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: email
            exp_annotations:
              summary: "Уведомления по каналу email не доставляются"
              description: "Канал отклоняет то, что ему передают, и повторов не будет. Остальные правила при этом остаются зелеными. Смотреть docker logs dm-notification-worker и dm-mail-worker."

  # Отказы входа разрезаются по причине: WrongLogin потоком — это перебор
  # адресов, WrongPassword — перебор паролей, и общее число не говорит ни того,
  # ни другого.
  - interval: 1m
    input_series:
      - series: 'dm_auth_login_failed_total{reason="WrongLogin"}'
        values: '0+600x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: AuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              reason: WrongLogin
            exp_annotations:
              summary: "Отказы входа по причине WrongLogin"
              description: "Отказы одной причины идут быстрее двух в секунду десять минут подряд. WrongLogin похож на перебор адресов, WrongPassword на перебор паролей, AccountLocked на уже запертых людей. Смотреть docker logs dm-api."

  # Письмо о выпуске уходит, пока current сменился меньше 15 минут назад, и
  # смолкает после.
  - interval: 1m
    input_series:
      - series: 'dm_release{field="changed",tag="v1.1.0"}'
        values: '60+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ReleaseChanged
        exp_alerts:
          - exp_labels:
              severity: warning
              field: changed
              tag: v1.1.0
            exp_annotations:
              summary: "На сервере живет выпуск v1.1.0"
              description: "Каталог выпуска сменился меньше 15 минут назад: выпуск, откат или обслуживание. Что живет и что пробовалось: sudo dm3-release status."
      - eval_time: 20m
        alertname: ReleaseChanged
        exp_alerts: []

  # Отказ новее последней смены current поднимает алерт своего тега. Следующий
  # выпуск, сменивший current, его снимает.
  - interval: 1m
    input_series:
      - series: 'dm_release{field="changed",tag="v1.1.0"}'
        values: '100+0x10 _x10'
      - series: 'dm_release{field="changed",tag="v1.3.0"}'
        values: '_x10 900+0x10'
      - series: 'dm_release{field="failed",tag="v1.2.0"}'
        values: '300+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              field: failed
              tag: v1.2.0
            exp_annotations:
              summary: "Выпуск v1.2.0 не встал"
              description: "Выпуск отклонен или упал, сайт остался на прежнем выпуске или восстановлен. Таймер этот тег больше не берет. Причина в sudo dm3-release status и в journalctl -u dm3-release. Исправление выходит новой версией, а выпуск, которому нужно обслуживание, ставит sudo dm3-release maintain с его тегом."
      - eval_time: 15m
        alertname: ReleaseFailed
        exp_alerts: []

  # Ожидание считается от первого раза: до часа молчит, после пишет. Ноль
  # значит, что ничего не ждет, и он молчит сколько угодно долго.
  - interval: 1m
    input_series:
      - series: 'dm_release{field="waiting_since",tag="x"}'
        values: '0+0x10 600+0x80'
      - series: 'dm_release{field="fetched"}'
        values: '0+60x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: ReleaseWaiting
        exp_alerts: []
      - eval_time: 72m
        alertname: ReleaseWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              field: waiting_since
              tag: x
            exp_annotations:
              summary: "Выпуск не доходит до сервера больше часа"
              description: "Либо подписанный тег ждет: стенд нездоров, образ не скачивается или не хватает памяти, либо сервер час не может прочесть список тегов репозитория. Причина в sudo dm3-release status и в journalctl -u dm3-release."

  # Список тегов, который сервер час не мог прочесть, тоже ожидание.
  - interval: 1m
    input_series:
      - series: 'dm_release{field="waiting_since"}'
        values: '0+0x90'
      - series: 'dm_release{field="fetched"}'
        values: '60+0x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: ReleaseWaiting
        exp_alerts: []
      - eval_time: 62m
        alertname: ReleaseWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              field: fetched
            exp_annotations:
              summary: "Выпуск не доходит до сервера больше часа"
              description: "Либо подписанный тег ждет: стенд нездоров, образ не скачивается или не хватает памяти, либо сервер час не может прочесть список тегов репозитория. Причина в sudo dm3-release status и в journalctl -u dm3-release."

  # Отвергнутый тег пишет на том тике, где его отвергли, и молчит на следующем.
  - interval: 5m
    input_series:
      - series: 'dm_release{field="rejected"}'
        values: '0 2 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: ReleaseTagRejected
        exp_alerts: []
      - eval_time: 5m
        alertname: ReleaseTagRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              field: rejected
            exp_annotations:
              summary: "Сервер отверг теги выпуска"
              description: "Тег с именем выпуска не прошел проверку подписи или полей, сайт не тронут. Если тег ставил подписывающий, проверить его ключ и сообщение тега, иначе тег поставил кто-то без ключа. Причина каждого в journalctl -u dm3-release."
      - eval_time: 10m
        alertname: ReleaseTagRejected
        exp_alerts: []

  # Образы старше 30 дней: на 29-й день молчит, на 31-й пишет.
  - interval: 1d
    input_series:
      - series: 'dm_release{field="built"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 29d
        alertname: ReleaseStale
        exp_alerts: []
      - eval_time: 31d
        alertname: ReleaseStale
        exp_alerts:
          - exp_labels:
              severity: warning
              field: built
            exp_annotations:
              summary: "Живые образы собраны больше 30 дней назад"
              description: "Исправления базовых образов приходят только с новой сборкой. Нужен новый коммит в dev, хватит пустого, затем выпуск из его сборки."

  # Близнец, живой 15 минут, пережил выпуск. Основной экземпляр рядом не в счет.
  - interval: 1m
    input_series:
      - series: 'up{job="dm-api",instance="dm-api-next:5000"}'
        values: '1+0x20'
      - series: 'up{job="dm-api",instance="dm-api:5000"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: ApiRolloutUnfinished
        exp_alerts: []
      - eval_time: 16m
        alertname: ApiRolloutUnfinished
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dm-api
              instance: dm-api-next:5000
            exp_annotations:
              summary: "Близнец API пережил выпуск"
              description: "dm-api-next работает 15 минут, а выпуск длится минуты. Команда sudo dm3-release recover возвращает край на основные контейнеры и убирает близнецов."
