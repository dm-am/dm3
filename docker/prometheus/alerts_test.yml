# Unit-тесты правил алертинга (promtool test rules).
#
# promtool check config разбирает синтаксис и молчит о смысле: выражение,
# читающее не ту серию, парсится ровно так же, как правильное. Здесь правило
# прогоняется по заданному ряду и проверяется, что оно срабатывает именно на том
# состоянии, ради которого написано.
#
# Не полный набор. Правила, срабатывающие на up == 0 и absent(), проверяются
# самим наличием цели в prometheus.yml — их дублирование здесь ничего не ловит.
# Сюда попадает то, где выражение можно написать синтаксически верно и по смыслу
# мимо: суммы по нескольким сериям и разрезы по меткам.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # Слушатель живых уведомлений, который пять минут подряд не слушает: правило
  # срабатывает на экземпляр. Рядом экземпляр, который слушает, и он молчит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_push_listening{job="dm-api",instance="dm-api-1:8080"}'
        values: '0+0x10'
      - series: 'dm_messaging_push_listening{job="dm-api",instance="dm-api-2:8080"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RealtimePushNotListening
        exp_alerts: []
      - eval_time: 6m
        alertname: RealtimePushNotListening
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dm-api
              instance: dm-api-1:8080
            exp_annotations:
              summary: "API dm-api-1:8080 не слушает живые уведомления"
              description: "Пять минут экземпляр API не слушает канал уведомлений в базе, поэтому живые уведомления в его вкладки не приходят. Сами уведомления сохранены и читаются запросом. Смотреть docker logs dm-api и строку realtime-push в /_health/detail."

  # Возраст очереди разрезается по очереди: застрявшая почта поднимает алерт
  # про почту, а пустая очередь уведомлений рядом молчит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_lag_seconds{queue="dm.mail.sending"}'
        values: '600+60x15'
      - series: 'dm_messaging_outbox_lag_seconds{queue="dm.notifications"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: OutboxBacklogAging
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "Записи застряли в очереди dm.mail.sending"
              description: "Самая старая ожидающая запись очереди ждет больше 5 минут, уведомления, письма и счетчики по ней не уходят. Ничего не потеряно, записи ждут обработки. Смотреть поля Attempts и LastError у старых записей в базе и docker logs обработчика очереди."

  # Мертвая запись поднимает алерт своей очереди, если живет пять минут. Рядом
  # очередь без мертвых записей, и она молчит. Вторая очередь показывает, что
  # правило не привязано к одной.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{queue="dm.mail.sending"}'
        values: '0+0x2 1+0x10'
      - series: 'dm_messaging_outbox_dead{queue="dm.notifications"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts: []
      - eval_time: 9m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.mail.sending
            exp_annotations:
              summary: "В очереди dm.mail.sending есть мертвые записи"
              description: 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'

  # Мертвая запись события поднимает тот же алерт под своей очередью, а запись,
  # которую вернули или удалили, его гасит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_outbox_dead{queue="dm.notifications"}'
        values: '2+0x7 0+0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeadOutboxRows
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: dm.notifications
            exp_annotations:
              summary: "В очереди dm.notifications есть мертвые записи"
              description: 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'
      - eval_time: 10m
        alertname: DeadOutboxRows
        exp_alerts: []

  # Отказы доставки разрезаются по каналу: одно правило на все каналы назвало бы
  # в письме "channel" пустым, и получатель не узнал бы, какой из них лежит.
  - interval: 1m
    input_series:
      - series: 'dm_messaging_delivery_failed_total{channel="email",event="NewTopic"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DeliveriesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: email
            exp_annotations:
              summary: "Уведомления по каналу email не доставляются"
              description: "Канал отклоняет то, что ему передают, и повторов не будет. Остальные правила при этом остаются зелеными. Смотреть docker logs dm-notification-worker и dm-mail-worker."

  # Отказы входа разрезаются по причине: WrongLogin потоком — это перебор
  # адресов, WrongPassword — перебор паролей, и общее число не говорит ни того,
  # ни другого.
  - interval: 1m
    input_series:
      - series: 'dm_auth_login_failed_total{reason="WrongLogin"}'
        values: '0+600x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: AuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              reason: WrongLogin
            exp_annotations:
              summary: "Отказы входа по причине WrongLogin"
              description: "Отказы одной причины идут быстрее двух в секунду десять минут подряд. WrongLogin похож на перебор адресов, WrongPassword на перебор паролей, AccountLocked на уже запертых людей. Смотреть docker logs dm-api."
