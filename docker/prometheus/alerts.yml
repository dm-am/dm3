groups:
  # Every rule below says something when the site is unwell, and none of them says
  # anything when the contour itself is broken: a relay that refuses mail, an
  # alertmanager that stopped, a Prometheus that lost its rules. Silence then reads
  # exactly like health, and the first symptom is a user asking why nobody noticed.
  #
  # This one fires always and on purpose. Its arrival is the proof that rules are
  # evaluated, routed and delivered; its absence is the incident. What watches for
  # that absence is outside the machine by definition — a mailbox filter, a phone
  # reminder, an external heartbeat service — because a watchman living on the
  # observed machine cannot report its own death.
  - name: dm-contour
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          summary: "Контур оповещений работает"
          description: "Это письмо приходит по расписанию, пока правила вычисляются и доставка работает. Если письма перестали приходить, контур сломан, что бы ни показывали дашборды. Смотреть docker logs dm-prometheus и dm-alertmanager."

      # The receiver every other rule in this file is posted to. Firing this one
      # cannot deliver a letter either - it travels the same broken road - so what
      # it buys is a rule visible as firing on the page, and, the moment the
      # receiver is back, a letter naming how long the contour had no mouth. The
      # absent() branch is the other way this goes quiet: a job renamed out of
      # prometheus.yml produces no `up` series for `== 0` to compare.
      #
      # There is deliberately no rule on the count of failed notifications: it
      # would be posted through the very thing that is failing.
      - alert: AlertReceiverDown
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Оповещения никому не доставляются"
          description: "Alertmanager недоступен: правила вычисляются, но их письма никуда не уходят. Об этом узнает только тот, кто заметит, что письма Watchdog перестали приходить. Смотреть docker logs dm-alertmanager и страницу Targets в Prometheus."

  - name: dm-api
    rules:
      - alert: ApiDown
        expr: up{job="dm-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API DM не отвечает"
          description: "Prometheus больше минуты не может опросить dm-api, сайт, скорее всего, недоступен. Запросы пользователей заканчиваются ошибкой или не доходят. Смотреть docker ps и docker logs dm-api."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="dm-api",http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="dm-api"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Много ответов 5xx"
          description: "Больше 5% запросов к API пять минут подряд заканчиваются ошибкой сервера. Пользователи видят сообщения об ошибке на разных страницах. Смотреть docker logs dm-api и логи в Grafana."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job="dm-api"}[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API отвечает медленно"
          description: "Пять минут подряд самые медленные 5% запросов к API идут дольше 2 секунд. Ошибок при этом может не быть. Смотреть трассы в Jaeger и нагрузку на PostgreSQL."

  # Authorization refusing because it could not answer, which is the same answer it
  # gives when the rules mean it. Nothing else tells the two apart, and the reader is
  # told they may not do something they in fact may.
  - name: dm-authorization
    rules:
      - alert: AuthorizationResolverMissing
        expr: increase(dm_authorization_resolver_missing_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Вопрос о правах не дошел до обработчика"
          description: "{{ $labels.intention }} для {{ $labels.target }} отклоняется потому, что на вопрос о правах никто не отвечает, а не потому, что правила запрещают. Пользователь видит отказ в том, что ему разрешено. Смотреть docker logs dm-api."

  - name: dm-consumers
    rules:
      - alert: ConsumerDown
        expr: up{job=~"dm-(notification|mail)-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Обработчик {{ $labels.job }} не работает"
          description: "{{ $labels.job }} больше 2 минут не отвечает на опрос. Письма и уведомления копятся в очереди и не уходят. Смотреть docker logs {{ $labels.job }}."

      # A renamed or removed scrape target produces no `up` series at all, so
      # ConsumerDown stays silent on exactly the change that breaks it.
      - alert: ConsumerScrapeTargetMissing
        expr: |
          absent(up{job="dm-notification-worker"})
          or absent(up{job="dm-mail-worker"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Не настроена цель опроса обработчика"
          description: "В Prometheus нет цели для одного из обработчиков, поэтому ConsumerDown о нем молчит. Скорее всего, задание переименовано. Сверить имена заданий в docker/prometheus.yml с именами контейнеров."

  - name: dm-infrastructure
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL недоступен"
          description: "Экспортер сообщает, что база данных не отвечает, и сайт не может читать и писать данные. Это останавливает почти все страницы. Смотреть docker logs dm-pg и dm-pg-exporter."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Память хоста почти занята"
          description: "Больше 90% памяти хоста занято пять минут подряд. Дальше система начнет убивать процессы. Смотреть docker stats."

      # Severity below the two above on purpose: the console sink writes every
      # event unconditionally, so a dead store loses the searchable copy and not
      # the logs. What makes it worth a rule at all is that the loss is silent by
      # construction - the sink swallows its own failures, buffers 50000 events
      # and retries for ten minutes before dropping them, and Grafana showing
      # nothing looks exactly like a site with nothing to say. The absent()
      # branch covers the other way this goes quiet: a job renamed out of
      # prometheus.yml produces no `up` series for `== 0` to compare.
      - alert: LogStorageDown
        expr: up{job="loki"} == 0 or absent(up{job="loki"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Хранилище логов недоступно"
          description: "Loki не принимает записи, поэтому поиск логов в Grafana ничего не показывает. Приложения продолжают писать в консоль, и docker logs хранит все. Смотреть docker logs dm-loki."

      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Мало места на диске"
          description: "Корневая файловая система занята больше чем на 85% десять минут подряд. Когда место кончится, база данных и хранилище файлов перестанут писать. Смотреть df -h и docker system df."

      # The site starts without object storage on purpose and keeps answering
      # while it is gone: uploads fail with 500 and pictures with 502, one request
      # at a time, and every other page is fine. That is exactly the failure no
      # health check of the site shows, so the scrape target is the signal.
      - alert: ObjectStorageDown
        expr: up{job="storage"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Хранилище файлов недоступно"
          description: "Метрики хранилища больше минуты не отвечают: загрузки файлов падают, аватары и вложения не открываются, остальные страницы работают. Проверки самого сайта этого не показывают. Смотреть docker logs dm-seaweedfs и dm-storage."

      # A renamed or removed scrape target produces no `up` series at all, so
      # ObjectStorageDown stays silent on exactly the change that breaks it.
      - alert: ObjectStorageScrapeTargetMissing
        expr: absent(up{job="storage"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Не настроена цель опроса хранилища файлов"
          description: "В Prometheus нет цели для хранилища файлов, поэтому ObjectStorageDown о нем молчит. Скорее всего, задание переименовано. Сверить задание storage в docker/prometheus.yml и порт метрик dm-storage."

  # The queue is the outbox table: a row waits there between the service that
  # stored it and the worker that will act on it. Every rule above is about a
  # process answering, and all of them are true of a worker that has stopped
  # draining its queue.
  - name: dm-queue
    rules:
      # The push listener of an API instance, read off the instance itself: each one
      # holds a connection of its own that LISTENs on the push channel, and the gauge
      # reads 1 while it does and 0 from the start until it does. Zero and not absent,
      # so an instance that never reached its database is caught too; an instance that
      # is down answers no scrape and is named by the rules about the process.
      #
      # Severity: warning, because a push copies a notification the dispatcher has
      # already stored and the client reads over REST. Nothing that exists only in a
      # push is lost by dropping it.
      - alert: RealtimePushNotListening
        expr: dm_messaging_push_listening == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API {{ $labels.instance }} не слушает живые уведомления"
          description: "Пять минут экземпляр API не слушает канал уведомлений в базе, поэтому живые уведомления в его вкладки не приходят. Сами уведомления сохранены и читаются запросом. Смотреть docker logs dm-api и строку realtime-push в /_health/detail."

      # A dead row spent its ladder or was rejected, and no worker takes it again
      # until a human returns it. The gauge is read from the table on every scrape,
      # one series per queue, so a dead letter and a dead event each fire. NaN, the
      # value of an unreachable database, compares false and leaves this to the
      # database rules. The command is DeadRows.ReturnCommand, which a gate holds
      # this text to.
      - alert: DeadOutboxRows
        expr: dm_messaging_outbox_dead > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "В очереди {{ $labels.queue }} есть мертвые записи"
          description: 'Записи очереди исчерпали повторы или не читаются, и больше их никто не возьмет. Причина в поле LastError: SELECT "Id", "DeadUtc", "LastError" FROM "OutboxEvents" WHERE "DeadUtc" IS NOT NULL. Вернуть запись в очередь, когда причина устранена: UPDATE "OutboxEvents" SET "DeadUtc" = NULL, "Attempts" = 0, "NextAttemptUtc" = NULL WHERE "Id" = <Id> AND "DeadUtc" IS NOT NULL AND "ProcessedUtc" IS NULL; Письмо об учетной записи, мертвое больше 48 часов, не возвращать, а удалить: ссылка в нем уже истекла.'

      # The rules above see the queue; this one sees the outcome. A worker that
      # claims every row and fails on every row keeps its queue short and its loop
      # alive, so it is invisible from the depth of the queue alone.
      - alert: ConsumerFailingMessages
        expr: sum by (queue) (rate(dm_messaging_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Обработчик очереди {{ $labels.queue }} роняет сообщения"
          description: "Сообщения завершаются исключением. Где у очереди есть очередь недоставленных, они ждут там, у очереди живых уведомлений ее нет, и сообщения пропадают. Смотреть docker logs обработчика."

      # Retries rise long before failures do: a queue being processed on the
      # second attempt is a queue about to stop being processed.
      - alert: ConsumerRetryingHeavily
        expr: sum by (queue) (rate(dm_messaging_retried_total[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Обработчик очереди {{ $labels.queue }} часто повторяет"
          description: "Обработка то падает, то проходит со второй попытки. Сервис, от которого она зависит, нездоров, и скоро повторы перестанут помогать. Смотреть docker logs обработчика."

      # The publishing side of the same trade. SYSTEM.md says an event is not the
      # carrier of the fact, so the producer swallows a refusal rather than turning
      # a committed write into a 500. That only holds while the swallowing is
      # visible: without this rule the swallowed losses look exactly like a quiet
      # site, and the first symptom is a user asking why notifications stopped.
      - alert: EventsNotPublished
        expr: sum by (event) (rate(dm_messaging_publish_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "События типа {{ $labels.event }} не попали в исходящую очередь"
          description: "Это безвозвратные потери: запись в исходящую очередь отклонена сразу после сохранения данных, или не ушло письмо о входе. Их никто не хранит и не повторит. Смотреть docker logs dm-api."

      # The rows wait in the table, each worker claims its queue every second,
      # and what matters is how long the oldest one has been waiting. Five
      # minutes is longer than any deploy's restart, so this firing means a
      # worker is down or stuck on a row - either way a human call.
      # The gauge is read from the table on every scrape, one series per queue,
      # so each queue fires on its own and a hung loop cannot freeze it.
      - alert: OutboxBacklogAging
        expr: dm_messaging_outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Записи застряли в очереди {{ $labels.queue }}"
          description: "Самая старая ожидающая запись очереди ждет больше 5 минут, уведомления, письма и счетчики по ней не уходят. Ничего не потеряно, записи ждут обработки. Смотреть поля Attempts и LastError у старых записей в базе и docker logs обработчика очереди."

      # The far end of the same road. The row left the queue, reached a
      # sender, and the channel refused it - a bot token revoked, a relay
      # rejecting every letter, a push nobody is subscribed to. The sender
      # swallows that so one dead channel cannot cost the recipient duplicates
      # over the channels that are up, which means every rule above stays green
      # while nothing is being delivered at all.
      - alert: DeliveriesFailing
        expr: sum by (channel) (rate(dm_messaging_delivery_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Уведомления по каналу {{ $labels.channel }} не доставляются"
          description: "Канал отклоняет то, что ему передают, и повторов не будет. Остальные правила при этом остаются зелеными. Смотреть docker logs dm-notification-worker и dm-mail-worker."

  # A unit of work spans two stores with no transaction over them: the row is
  # committed to PostgreSQL first because it is the fact, and the document that
  # counts it follows. When the second write fails there is nothing left to
  # unwind, so the count is dropped and the fact kept — and the request that
  # caused it answers success either way. Without a rule the only symptom is one
  # reader's badge being wrong from then on, which reads to them as the site
  # being wrong about them rather than as an incident.
  - name: dm-storage
    rules:
      - alert: WritesLostAfterCommit
        expr: sum by (store, operation) (rate(dm_storage_write_lost_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Записи в {{ $labels.store }} теряются в операции {{ $labels.operation }}"
          description: "Основная работа сохранена и подтверждена, а вторая запись не удалась. Повторов нет, и счетчик, который она вела, неверен, пока его не сбросят вручную. Смотреть docker logs dm-api."

  # The front door. Nothing here is about a component being unwell: the site is
  # perfectly healthy while somebody walks a list of addresses through the login
  # form, and that is the point - the request series answers 4xx for a typo and
  # for a credential-stuffing run alike, so the shape of what is happening lives
  # entirely in the reason a refusal carries.
  - name: dm-auth
    rules:
      # An absolute rate rather than a share of attempts: at four in the morning
      # one person mistyping their password twice is a hundred percent of the
      # traffic, and a share would page on it while saying nothing about the run
      # of ten thousand that arrives at noon among real logins.
      - alert: AuthFailureSpike
        expr: sum by (reason) (rate(dm_auth_login_failed_total[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Отказы входа по причине {{ $labels.reason }}"
          description: "Отказы одной причины идут быстрее двух в секунду десять минут подряд. WrongLogin похож на перебор адресов, WrongPassword на перебор паролей, AccountLocked на уже запертых людей. Смотреть docker logs dm-api."

      # Throttling is counted by status and not by reason: the limiter answers
      # before anything reads a credential, so no code that could count it runs.
      - alert: AuthThrottling
        expr: sum(rate(http_server_request_duration_seconds_count{job="dm-api",http_route=~"v1/account/(login|register)",http_response_status_code="429"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ограничитель входа и регистрации отклоняет запросы"
          description: "Запросы отклоняются до проверки пароля: либо идет автоматический перебор, либо пределы ниже нужд самого сайта. Настоящие пользователи при этом тоже получают отказ. Смотреть docker logs dm-api."

  - name: dm-backups
    rules:
      # Проверка бэкапов идет ночью по cron и до этого правила сообщала о себе
      # только кодом возврата в лог-файл, который никто не читает: получателя
      # почты на машине нет. Первым признаком беды было неудавшееся
      # восстановление.
      - alert: BackupVerificationFailed
        expr: dm_backup_verification_status > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'Ночная проверка бэкапов не прошла'
          description: 'dm_backup_verification_status = {{ $value }} (1 - предупреждение, 2 - ошибка). Смотреть /var/log/dm3-backup.log.'

      # Отсутствие результата - тоже результат: скрипт не запустился, упал до
      # записи метрики или его вовсе нет в crontab.
      - alert: BackupVerificationStale
        expr: time() - dm_backup_verification_timestamp_seconds > 172800
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'Проверка бэкапов не отчитывалась более двух суток'
          description: 'Последний отчет: {{ $value | humanizeDuration }} назад.'
