groups:
  - name: dm-api
    rules:
      - alert: ApiDown
        expr: up{job="dm-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DM API is down"
          description: "dm-api has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="dm-api",http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="dm-api"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors for 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job="dm-api"}[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "p95 latency is above 2 seconds for 5 minutes."

  - name: dm-consumers
    rules:
      - alert: ConsumerDown
        expr: up{job=~"dm-(notification|mail)-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consumer {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes."

      # A renamed or removed scrape target produces no `up` series at all, so
      # ConsumerDown stays silent on exactly the change that breaks it.
      - alert: ConsumerScrapeTargetMissing
        expr: |
          absent(up{job="dm-notification-worker"})
          or absent(up{job="dm-mail-worker"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A consumer scrape target is not configured"
          description: "Prometheus has no target for one of the consumers — check the job names against the container names."

  - name: dm-infrastructure
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter reports database is unreachable."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Host memory usage is above 90% for 5 minutes."

      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Root filesystem usage is above 85% for 10 minutes."

  # The broker is the only place that knows a message exists between the service
  # that sent it and the worker that will act on it. Every rule above is about a
  # process answering, and all of them are true of a worker that has stopped
  # consuming.
  - name: dm-broker
    rules:
      - alert: BrokerDown
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ is down"
          description: "The metrics endpoint of the broker has been unreachable for more than 1 minute."

      # A renamed or removed scrape target produces no `up` series at all, so
      # BrokerDown stays silent on exactly the change that breaks it.
      - alert: BrokerScrapeTargetMissing
        expr: absent(up{job="rabbitmq"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The broker scrape target is not configured"
          description: "Prometheus has no target for the broker - check that rabbitmq_prometheus is enabled and that per-object metrics are on."

      - alert: QueueWithoutConsumer
        expr: rabbitmq_queue_consumers{queue=~"dm.notifications|dm.mail.sending"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Queue {{ $labels.queue }} has no consumer"
          description: "Work is accumulating with nobody to process it. The worker process can be up and unsubscribed at the same time."

      - alert: QueueBacklog
        expr: rabbitmq_queue_messages_ready{queue=~"dm.*"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} is backing up"
          description: "More than 1000 messages have been waiting for 10 minutes."

      - alert: DeadLetteredMessages
        expr: rabbitmq_queue_messages_ready{queue=~".*-dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter queue {{ $labels.queue }} is not empty"
          description: "A message survived every retry and stopped here. Nothing else will look at it."
