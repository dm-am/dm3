global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'dm-api'
    static_configs:
      - targets: ['dm-api:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-notifications-consumer'
    static_configs:
      - targets: ['dm-notifications-consumer:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-search-engine-consumer'
    static_configs:
      - targets: ['dm-search-engine-consumer:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-email-sender-consumer'
    static_configs:
      - targets: ['dm-email-sender-consumer:5000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['dm-pg-exporter:9187']

  - job_name: 'node'
    static_configs:
      - targets: ['dm-node-exporter:9100']
