global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Where a firing rule goes. Prometheus evaluates the file above either way and
# keeps the result to itself: with no alertmanager to post to, every rule in it
# was a state on a page nobody opens. The routing and the receiver live in
# prometheus/alertmanager.yml.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['dm-alertmanager:9093']

scrape_configs:
  - job_name: 'dm-api'
    static_configs:
      - targets: ['dm-api:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-notification-worker'
    static_configs:
      - targets: ['dm-notification-worker:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-mail-worker'
    static_configs:
      - targets: ['dm-mail-worker:5000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['dm-pg-exporter:9187']

  - job_name: 'node'
    static_configs:
      - targets: ['dm-node-exporter:9100']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['dm-rmq:15692']
