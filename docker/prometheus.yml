global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'dm-api'
    static_configs:
      - targets: ['dm-api:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-notification-worker'
    static_configs:
      - targets: ['dm-notification-worker:5000']
    metrics_path: '/metrics'

  - job_name: 'dm-mail-worker'
    static_configs:
      - targets: ['dm-mail-worker:5000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['dm-pg-exporter:9187']

  - job_name: 'node'
    static_configs:
      - targets: ['dm-node-exporter:9100']
