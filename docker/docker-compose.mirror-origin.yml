# Основной сервер, когда перед ним стоит точка присутствия.
#
# Накладывается на docker-compose.yml и docker-compose.preview.yml. Отдельным
# файлом, а не переменными в preview-оверлее: перечень доверенных сетей там
# сверяется гейтом с подсетью базового compose, а необязательная переменная,
# оставшаяся пустой, роняет старт на разборе сети — оба отказа тише, чем лишний
# файл в команде.
#
# Что меняется. Краев перед приложением становится два: край точки присутствия и
# край основного сервера. Каждый дописывает в X-Forwarded-For того, кого увидел,
# поэтому посетитель оказывается на два элемента от конца, и ProxyCount обязан
# это учитывать. Оставленный на единице, он отдал бы приложению адрес края точки
# присутствия — один на всех посетителей: лимит в сто запросов в минуту стал бы
# общим бюджетом сайта, а журнал входов писал бы всем один адрес.
#
# POP_ADDRESS — адрес точки присутствия и только он, маской /32. Запись шире
# покрывает соседей по диапазону, и заголовок, который они пришлют, будет принят
# на веру.
services:
  dmapi:
    environment:
      DM_ReverseProxyConfiguration__ProxyCount: '2'
      DM_ReverseProxyConfiguration__TrustedNetworks__1: ${POP_ADDRESS:?адрес точки присутствия, например 198.51.100.4/32}
