server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Content-Security-Policy belongs on the document, so it lives here and
        # not at server level: the static-asset location below declares its own
        # add_header, which would cancel inheritance anyway. The rest of the
        # security headers come from the edge proxy (docker/nginx/nginx.conf);
        # repeating them here would emit each one twice.
        #
        # 'unsafe-inline' for scripts is required by the anti-FOUC block in
        # index.html and by the javascript:void(0) hrefs the BBCode renderer
        # emits for spoiler heads; for styles it is required by Vue's runtime
        # style injection and by TipTap/ProseMirror.
        # Images stay wide open because avatars and uploads are served from a
        # deployment-configured imgproxy/CDN origin and because user BBCode may
        # embed any [img]; data: is the built-in default avatar, blob: is the
        # Safari path in the client-side image compressor.
        # connect-src assumes the single-origin topology (SPA and API behind one
        # proxy, SignalR on the same host) — a deployment that points
        # VITE_API_HOST at another origin has to add it here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; connect-src 'self' ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
