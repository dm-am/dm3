server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The stock mime.types names woff and woff2 and stops there, so a .ttf is
    # served as application/octet-stream - and gzip_types matches the type, not
    # the extension. Without these four lines the font/ttf entry below matches
    # nothing and the megabyte it was added for still travels raw.
    types {
        font/ttf   ttf;
        font/otf   otf;
    }

    # Gzip compression
    gzip on;
    # font/ttf is on this list because the family is TrueType and TrueType is
    # not compressed in itself: a megabyte of it travelled both hops raw.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/ttf;

    # SPA routing - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Content-Security-Policy belongs on the document, so it lives here and
        # not at server level: the static-asset location below declares its own
        # add_header, which would cancel inheritance anyway. The rest of the
        # security headers come from the edge proxy (docker/nginx/nginx.conf);
        # repeating them here would emit each one twice.
        #
        # script-src carries no 'unsafe-inline'. It is the one directive that
        # matters on a site binding server-rendered user HTML through v-html on
        # every page, and it was switched off for two decorations: the anti-FOUC
        # block in index.html and javascript:void(0) hrefs. The hrefs are gone
        # (the renderer emits href="#" and the client preventDefaults), and the
        # anti-FOUC block is named by the sha256 of its exact body. That hash is
        # recomputed from index.html by src/csp.spec.ts, so editing the boot
        # script fails the test with the new value rather than silently killing
        # the script in production. For styles 'unsafe-inline' stays: it is
        # required by Vue's runtime style injection and by TipTap/ProseMirror.
        # Images stay wide open because avatars and uploads are served from a
        # deployment-configured imgproxy/CDN origin and because user BBCode may
        # embed any [img]; data: is the built-in default avatar, blob: is the
        # Safari path in the client-side image compressor.
        # connect-src assumes the single-origin topology (SPA and API behind one
        # proxy, SignalR on the same host) — a deployment that points
        # VITE_API_HOST at another origin has to name that origin here, for the
        # requests and for the hub alike. The hub needs no scheme source of its
        # own: 'self' matches ws:// and wss:// on this host and port, by the
        # clause of "does url match expression in origin" that matches when the
        # url's scheme is https or wss, or the document's own scheme is http.
        # A bare ws: or wss: matches every host there is instead, which left the
        # one directive bounding where a page may send data bounding nothing.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-etlJFEHdizaAFiE5k3rlDARNGFe0UdDoJcDPLcAjz74='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
