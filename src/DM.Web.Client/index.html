<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The two faces every address needs: Reset.sass sets the root elements in
         PT Sans, so the roman and the bold are on the critical path of the first
         paint. Without these the request for them leaves only after the bundle's
         stylesheet has been fetched and parsed. The italics are not here on
         purpose — they appear inside content, not in the page frame.
         crossorigin is not decoration: a font is fetched in anonymous CORS mode,
         and a preload without it warms a different cache entry than the one
         @font-face later asks for. Kept in step with assets/styles/Fonts.sass by
         src/fontDelivery.spec.ts. -->
    <link
      rel="preload"
      href="/src/assets/fonts/PTSans-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    >
    <link
      rel="preload"
      href="/src/assets/fonts/PTSans-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    >
    <!-- The static head answers every address: with no server render it is
         what a crawler and a link preview read. It carries site-level truths
         only, one copy of each, and its title is composed like every tab title
         (docs/conventions/UI_STANDARDS.md). -->
    <meta
      name="description"
      content="Платформа для текстовых форумных ролевых игр: создавайте игры, ведите блоги, общайтесь на форуме и в чате с сообществом."
    >
    <!-- Single theme-aware meta; content is kept in sync with the JS theme
         class (not prefers-color-scheme) by the anti-FOUC script below at
         boot and by the theme watcher in App.vue on switch. -->
    <meta name="theme-color" content="#ffffff">
    <meta property="og:site_name" content="Dungeon Master">
    <meta property="og:title" content="Форумные ролевые игры">
    <meta
      property="og:description"
      content="Платформа для текстовых форумных ролевых игр: создавайте игры, ведите блоги, общайтесь на форуме и в чате с сообществом."
    >
    <meta property="og:type" content="website">
    <meta property="og:image" content="/apple-touch-icon.png">
    <meta property="og:locale" content="ru_RU">
    <title>Форумные ролевые игры | Dungeon Master</title>
    <script>
      // Anti-FOUC: apply the persisted theme class to <html> before the bundle
      // loads, so a dark-theme user never sees a light flash. Mirrors the
      // getInitialTheme() logic in shared/stores/ui.ts (localStorage key
      // "dm_theme" with values "Light"/"Dark", then prefers-color-scheme, then
      // Light). App.vue swaps these classes (and the theme-color meta below)
      // reactively afterwards.
      // Hex values mirror --bg-page in assets/styles/ThemeVariables.css
      // (Light: #fff, Dark: #222222).
      (function () {
        var THEME_COLORS = { Light: "#ffffff", Dark: "#222222" };
        try {
          var stored = localStorage.getItem("dm_theme");
          var theme =
            stored === "Light" || stored === "Dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "Dark"
                : "Light";
          document.documentElement.classList.add("theme_" + theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", THEME_COLORS[theme]);
        } catch (e) {
          document.documentElement.classList.add("theme_Light");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <strong>Увы, наш сайт не работает с выключенным JavaScript.</strong>
    </noscript>
    <div id="application"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
