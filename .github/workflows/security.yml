name: Security Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 0'

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start PostgreSQL
        run: |
          docker run -d --name dm-pg -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=admin \
            -e POSTGRES_DB=dm3.5 \
            postgres:16
          sleep 10

      - name: Build and start API
        run: |
          docker build -t dm-api:test -f docker/app.Dockerfile .
          docker run -d --name dm-api -p 5051:5050 \
            -e ConnectionStrings__Rdb="Host=host.docker.internal;Database=dm3.5;Username=postgres;Password=admin" \
            dm-api:test

      - name: Wait for API
        run: timeout 60 bash -c 'until curl -sf http://localhost:5051/_health; do sleep 2; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5051'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
