name: Security Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for Docker Compose
        run: cp docker/.env.example docker/.env

      - name: Start infrastructure with Docker Compose
        run: |
          cd docker
          docker compose up -d postgres mongo rabbitmq minio mailhog opensearch jaeger
          docker compose up -d --wait migration

      - name: Build and start API
        run: |
          cd docker
          docker compose up -d --build --wait dmapi

      - name: Wait for API health
        run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

      - name: Prepare ZAP workspace
        run: |
          touch zap.yaml report_json.json report_md.md report_html.html
          chmod 777 zap.yaml report_json.json report_md.md report_html.html

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Cleanup
        if: always()
        run: cd docker && docker compose down -v
