name: Security Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Static analysis. DAST (below) only sees what it can reach over HTTP; the
  # defect classes that matter most here — unescaped output reaching a rendered
  # surface, injection, unsafe deserialisation — are source-level.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build for analysis
        if: matrix.language == 'csharp'
        run: dotnet build DM.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for Docker Compose
        run: cp docker/.env.example docker/.env

      - name: Start infrastructure with Docker Compose
        run: |
          cd docker
          docker compose up -d postgres mongo rabbitmq minio mailhog opensearch jaeger
          docker compose up -d --wait migration

      - name: Build and start API
        run: |
          cd docker
          docker compose up -d --build --wait dmapi

      - name: Wait for API health
        run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

      - name: Prepare ZAP workspace
        run: |
          touch zap.yaml report_json.json report_md.md report_html.html
          chmod 777 zap.yaml report_json.json report_md.md report_html.html

      # fail_action makes this a gate: any alert whose rule is marked FAIL in
      # .zap/rules.tsv breaks the build. Triage lives in that file — a rule is
      # either promoted to FAIL or explicitly IGNORE'd with a stated reason.
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: true
          artifact_name: 'zap-baseline-report'

      - name: Cleanup
        if: always()
        run: cd docker && docker compose down -v
