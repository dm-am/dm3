name: Security Scanning

on:
  # Called from the build workflow rather than triggered beside it, so the publishing jobs can
  # name these in `needs`. Triggered separately, they ran on the same push and finished
  # whenever: an image with a red CodeQL or ZAP reached the registry and watchtower installed
  # it within five minutes.
  workflow_call:
    # Which scans the change needs, as the map of scripts/ci-paths.json decided
    # in the changes job of the caller. One input per job, named as the job.
    inputs:
      codeql:
        type: boolean
        default: true
      zap-scan:
        type: boolean
        default: true
  # The weekly full scan stands on its own: it is about the code as it sits, and there is no
  # build to gate.
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  # A literal name, not ${{ github.workflow }}: called through workflow_call, that is the
  # CALLER's name, i.e. the group the caller already holds, and GitHub would cancel the run
  # this job lives in.
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: true

# Every job pins its runner image, so we move when we choose. timeout-minutes ends a hang
# instead of holding the branch for GitHub's six hours; it is far above the real time on
# purpose, since a ceiling guessed close turns a slow runner into a red build.
jobs:
  # Static analysis: the defect classes that matter most here (unescaped output reaching a
  # rendered surface, injection, unsafe deserialisation) are source-level, which the DAST
  # below cannot see.
  codeql:
    # On its own schedule there are no inputs, and an absent input reads as
    # false, so the weekly scan is let through by name.
    if: github.event_name == 'schedule' || inputs.codeql
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # manual: the build below is what CodeQL traces; the autobuild default picks its own command.
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended, not security-and-quality, which adds maintainability queries that
          # bury real findings under style alerts.
          queries: security-extended
          # What the analysis leaves out, and why, is in the file.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build for analysis
        if: matrix.language == 'csharp'
        run: dotnet build DM.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  zap-scan:
    if: github.event_name == 'schedule' || inputs.zap-scan
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      # docker/.env.example ends with Development, and a scan of Development is a scan of a
      # surface that never ships (Swagger is mapped only there and the content policy relaxes
      # script-src). Through the environment, which compose prefers over .env.
      ASPNETCORE_ENVIRONMENT: Production
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The example file ships the encryption key empty, and compose declares it with ${...:?},
      # which rejects an empty value. init-env.sh creates docker/.env with throwaway values;
      # this stack is torn down with the job.
      - name: Generate the throwaway secrets compose refuses to start without
        run: |
          bash docker/scripts/init-env.sh local
          cd docker && docker compose config --quiet

      # --build on the migration line: its image is the API image, and compose pulls a missing
      # image before it considers building one, so otherwise the schema would come from the
      # published build and the scan would run against a different commit.
      - name: Start infrastructure with Docker Compose
        run: |
          cd docker
          docker compose up -d --wait storage seaweedfs
          docker compose up -d postgres mailpit jaeger
          docker compose up -d --build --wait migration

      - name: Build and start API
        run: |
          cd docker
          docker compose up -d --build --wait dmapi

      - name: Wait for API health
        run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

      - name: Prepare ZAP workspace
        run: |
          touch zap.yaml report_json.json report_md.md report_html.html
          chmod 777 zap.yaml report_json.json report_md.md report_html.html

      # fail_action makes this a gate: the scan fails the job on any alert its rule file does
      # not silence. Triage lives in .zap/rules.tsv: a rule is either left alone, and then it
      # breaks the build, or IGNORE'd with a stated reason. The file holds no FAIL line and the
      # gate still works, because silence is the failing state.
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: true
          artifact_name: 'zap-baseline-report'

      - name: Cleanup
        if: always()
        run: cd docker && docker compose down -v
