name: Security Scanning

on:
  # Called from the build workflow rather than triggered beside it, so that the
  # jobs which publish images can name these in `needs`. Triggered separately,
  # they ran on the same push and finished whenever they finished: an image with
  # a red CodeQL or a red ZAP reached the registry, took the `latest` tag on
  # main, and watchtower installed it within five minutes.
  workflow_call:
  # The weekly full scan stands on its own: it is about the code as it sits, not
  # about a change, and there is no build to gate.
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  # A literal name, not ${{ github.workflow }}. Called through workflow_call, this
  # runs inside the caller and github.workflow is the CALLER's name, so that
  # expression asks for the group the caller is already holding — GitHub answers
  # that by cancelling the run this job lives in. Since publishing waits on this
  # job, the whole graph would stop before an image ever reached the registry.
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Static analysis. DAST (below) only sees what it can reach over HTTP; the
  # defect classes that matter most here — unescaped output reaching a rendered
  # surface, injection, unsafe deserialisation — are source-level.
  codeql:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Far above the real time on purpose:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # manual: the build below is what CodeQL traces. Without an explicit
          # build-mode the action falls back to autobuild, which picks its own
          # command and can analyse a different set of assemblies.
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended, not security-and-quality: the latter adds
          # maintainability queries that would bury real findings under
          # thousands of style alerts on a 276k-line codebase.
          queries: security-extended

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build for analysis
        if: matrix.language == 'csharp'
        run: dotnet build DM.sln -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  zap-scan:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Far above the real time on purpose:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # docker/.env.example ends with Development for local work, and a scan of
      # Development is a scan of a surface that never ships: Swagger is mapped
      # only there and the content policy relaxes its script-src for it, so the
      # tool both sees what production does not have and misses what it does.
      # Through the environment rather than by rewriting a line of the file, the
      # way the throwaway encryption key below is handed in: compose prefers the
      # environment over .env.
      ASPNETCORE_ENVIRONMENT: Production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The example file ships the encryption key and the imgproxy signing pair
      # empty, and compose declares all three with ${...:?} — which rejects an
      # empty value, not just a missing one. Copying the example alone left every
      # step below dead. Throwaway values are generated here because this stack
      # is torn down with the job.
      #
      # Through the environment rather than by rewriting the lines in .env:
      # compose prefers the environment over the file, so this keeps working if
      # the example ever gains a value, a comment or trailing whitespace — the
      # anchored sed it replaces would have silently matched nothing.
      - name: Generate the throwaway secrets compose refuses to start without
        run: |
          echo "DM_CryptoConfiguration__KeyBase64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "IMGPROXY_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "IMGPROXY_SALT=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Create .env for Docker Compose
        run: |
          cp docker/.env.example docker/.env
          cd docker && docker compose config --quiet

      # --build on the migration line: its image is the API image, and that is
      # now the tag the registry publishes. Compose pulls a missing image before
      # it considers building one, so without this the schema would come from the
      # published build and the scan would run against a different commit.
      - name: Start infrastructure with Docker Compose
        run: |
          cd docker
          docker compose up -d postgres mongo rabbitmq minio mailhog jaeger
          docker compose up -d --build --wait migration

      - name: Build and start API
        run: |
          cd docker
          docker compose up -d --build --wait dmapi

      - name: Wait for API health
        run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

      - name: Prepare ZAP workspace
        run: |
          touch zap.yaml report_json.json report_md.md report_html.html
          chmod 777 zap.yaml report_json.json report_md.md report_html.html

      # fail_action makes this a gate: the scan fails the job on any alert its
      # rule file does not silence, not only on rules marked FAIL. Triage lives
      # in .zap/rules.tsv - a rule is either left alone, and then it breaks the
      # build, or explicitly IGNORE'd with a stated reason. Reading it the other
      # way round is the trap: the file holds no FAIL line and the gate still
      # works, because silence is the failing state here, not the passing one.
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: true
          artifact_name: 'zap-baseline-report'

      - name: Cleanup
        if: always()
        run: cd docker && docker compose down -v
