name: .NET

on:
  push:
    branches: [ main, dev ]
    # The installer pins a release by tag, and a tag names one tree.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  # The full set once a week on dev, the one branch a schedule runs on: what changes without a
  # commit (an advisory, a base image, a runner) is found here and not by the next unrelated push.
  schedule:
    - cron: '0 2 * * 0'

# Least privilege by default; the publish job widens it for itself only.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight, except on the refs that
# publish: cancelling between two legs of the publish matrix leaves the registry with half a
# release. promote-images is what makes one tag mean one commit; this only keeps a superseded
# run from leaving orphaned digests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}

env:
  REGISTRY: ghcr.io
  # Must match the image names docker/docker-compose.yml pulls (ghcr.io/<owner>/dm-api, dm-worker-*).
  IMAGE_PREFIX: ${{ github.repository_owner }}/dm

# Every job pins its runner image, so we move when we choose. timeout-minutes ends a hang
# instead of holding the branch for GitHub's six hours; it is far above the real time on
# purpose, since a ceiling guessed close turns a slow runner into a red build.
jobs:
  # Which jobs this change needs, from the one map of paths in scripts/ci-paths.json; the
  # pre-push hook and scripts/gates.sh read the same map through the same script. A push is
  # compared with the last green run of this workflow on the branch, not github.event.before:
  # after a red push that would compare against the red commit and skip the jobs that were
  # red. A tree diff holds across a force push, and a commit the clone no longer has is a
  # diff git cannot build, which the script answers with the full set. A pull request is
  # compared with the merge base of its target. Tags and the schedule run everything. Built
  # in rather than dorny/paths-filter, which compares with github.event.before and would be
  # a second reader of the map.
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      frontend: ${{ steps.select.outputs.frontend }}
      e2e: ${{ steps.select.outputs.e2e }}
      deployment-smoke: ${{ steps.select.outputs.deployment-smoke }}
      dependency-scan: ${{ steps.select.outputs.dependency-scan }}
      codeql: ${{ steps.select.outputs.codeql }}
      zap-scan: ${{ steps.select.outputs.zap-scan }}
      compose-topology: ${{ steps.select.outputs.compose-topology }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
    # The summary says which groups of paths changed and whether each job runs and why.
    - name: Select the jobs this change needs
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BRANCH: ${{ github.ref_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        case "$EVENT/$REF" in
          pull_request/*)
            SOURCE=(--diff "origin/$BASE_REF...HEAD") ;;
          push/refs/heads/*)
            GREEN=$(gh run list --workflow dotnet.yml --branch "$BRANCH" --status success --limit 20 \
              --json headSha,event --jq '[.[] | select(.event == "push" or .event == "schedule")][0].headSha // ""') \
              || GREEN=""
            if [ -n "$GREEN" ]; then
              SOURCE=(--diff "$GREEN..HEAD")
            else
              SOURCE=(--full "no green run of this workflow on $BRANCH to compare with")
            fi ;;
          *)
            SOURCE=(--full "$EVENT on $REF") ;;
        esac
        node scripts/ci-paths.mjs "${SOURCE[@]}" --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    # .editorconfig declares a final newline and no trailing whitespace for the tree, and
    # nothing checked it. The whitespace subcommand skips the analyzer pass; it reformats C#
    # only and leaves trailing whitespace in comment lines alone, so the rest is on review.
    - name: Format
      run: dotnet format DM.sln whitespace --verify-no-changes
    # Release is what ships (docker/app.Dockerfile publishes -c Release).
    - name: Build
      run: dotnet build --no-restore -c Release
    # StatusDocumentShould runs scripts/docs/build-status.mjs --check, which reads the client
    # through the TypeScript compiler of its node_modules, so packages are installed before
    # the tests. The same Node as the frontend job.
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - name: Install client packages
      run: npm ci
      working-directory: src/DM.Web.Client
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
    # A threshold on the merged coverage; the numbers live next to the reason in the script.
    - name: Coverage threshold
      run: bash scripts/check-coverage.sh
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: TestResults/
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-reports
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: error
    # Swagger is not served in production, so the integration suite writes the contract out
    # for diffing between builds.
    - name: Upload OpenAPI contract
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: openapi-contract
        path: artifacts/openapi/*.json
        if-no-files-found: error

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/DM.Web.Client
    steps:
    - uses: actions/checkout@v7
    # The exact patch, not the major: npm ships inside the Node tarball and decides which npm
    # reads package-lock.json, and a floating '24' made `npm ci` reject a lock file written
    # by 24.13.0. The version lives in package.json (engines), here and in
    # src/DM.Web.Client/Dockerfile; FrontendToolchainShould holds the three equal.
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - run: npm ci
    - name: Dead code
      run: npm run knip
    - name: Lint
      run: npm run lint:ci
    - run: npm run type-check
    # The TypeScript of the frame stand, on the client's tools and lint config: the client run
    # does not reach outside its folder, so these run from the root.
    - name: Frame stand types
      working-directory: .
      run: src/DM.Web.Client/node_modules/.bin/vue-tsc --noEmit -p scripts/visual/tsconfig.json
    - name: Frame stand lint
      working-directory: .
      run: src/DM.Web.Client/node_modules/.bin/eslint --config src/DM.Web.Client/eslint.config.js --max-warnings 0 "scripts/visual/**/*.ts"
    - run: npm run build
    - run: npm run test:coverage
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frontend-coverage
        path: src/DM.Web.Client/coverage/
        if-no-files-found: warn

  # The end-to-end tier: a real stack, not a mock, since the suite talks to the API over HTTP
  # and asserts on what a browser renders. The shape is the one zap-scan uses, plus a seed.
  e2e:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    # The suite in shares, one leg per share on a runner and a stack of its own. The count
    # comes from strategy.job-total, so a leg added or removed cannot leave a share that no
    # leg runs.
    strategy:
      # Every leg runs to its end: a red leg cancelling the others would hide their failures
      # and flakes.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Every compose invocation in this job means the pair; repeating the flags is how one
      # of them ends up missing the overlay.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      # docker/.env.example ends with Development, and a tier that exercises Development
      # proves nothing about the build that ships (Swagger is mapped only there, and the
      # content policy relaxes script-src). Through the environment, which compose prefers
      # over .env.
      ASPNETCORE_ENVIRONMENT: Production
    steps:
    - uses: actions/checkout@v7

    # Pinned to the patch, as everywhere (see the frontend job).
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # docker/.env.example ships the encryption key empty, and compose declares it with
    # ${...:?}, which rejects an empty value as hard as a missing one. init-env.sh creates
    # docker/.env with throwaway values that die with the runner.
    - name: Generate the throwaway secrets compose refuses to start without
      run: bash docker/scripts/init-env.sh local

    # Load-bearing: one page load is a dozen and more API requests against a global budget of
    # 100 per address per minute, so a long spec file burns the minute in a few tests and the
    # rest fail on data-loading errors that look like stale selectors. Generated here, not
    # committed: docker-compose.yml and docker-compose.preview.yml are the deployed
    # combination, and a knob that must never reach a server does not belong in that set.
    - name: Overlay that turns rate limiting off and lets the preview origin in
      run: |
        cat > docker/docker-compose.e2e.yml <<'YAML'
        services:
          dmapi:
            environment:
              DM_RateLimiting__Enabled: "false"
              # The port the suite serves the built bundle from. The API adds the two
              # development ports only in Development, which this job is not; without it CORS
              # drops the responses and the origin check refuses the writes.
              DM_SiteAddressConfiguration__AdditionalOrigins__0: "http://localhost:5174"
        YAML

    # --build on the migration line too: its image is the API image, and compose pulls a
    # missing image before it considers building one, so a plain "up" would migrate with the
    # published build and test a commit that is not this one.
    - name: Start the stack
      working-directory: docker
      run: |
        docker compose config --quiet
        docker compose up -d --wait storage seaweedfs
        docker compose up -d postgres mailpit jaeger
        docker compose up -d --build --wait migration
        docker compose up -d --build --wait dmapi
        # The two workers the stand scripts start beside the API: notifications are born in one.
        docker compose up -d --build --wait dm-mail-worker dm-notification-worker

    - name: Wait for API health
      run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

    # The suite asserts against seeded accounts: global setup logs in as admin@test.local
    # before the first spec.
    - name: Seed the database
      working-directory: docker
      run: docker compose run --rm -T --build seeder all

    - name: Install dependencies
      working-directory: src/DM.Web.Client
      run: npm ci

    # Chromium only: the other projects of the config would multiply the wall clock and the
    # request count to re-verify the same assertions. Cross-browser belongs on a schedule.
    - name: Install Chromium
      working-directory: src/DM.Web.Client
      run: npx playwright install --with-deps chromium

    # playwright.config.ts builds the bundle and serves it with vite preview on port 5174,
    # which is not an allowed origin under Production, so the overlay above adds it. The share
    # goes after "--": the script stays the one definition of how the suite runs. The config
    # runs fullyParallel, so shares are cut by test and not by spec file.
    - name: Run the suite
      working-directory: src/DM.Web.Client
      run: npm run test:e2e:fast -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

    # retries: 2 in CI hides a test that failed twice and passed on the third, unless the
    # count and the names go on the run page itself. The reporter is declared in
    # playwright.config.ts. Each leg writes the summary of its own share, and the heading
    # names it.
    - name: Flaky tests of this run
      if: always()
      working-directory: src/DM.Web.Client
      env:
        SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Node rather than jq: the job installs it, and the same script runs on a developer
      # machine. A spec is flaky when Playwright retried it into a pass; suites nest, so the
      # walk is recursive.
      run: |
        node -e '
          const fs = require("fs");
          const report = "playwright-report/results.json";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const share = "shard " + process.env.SHARD;
          if (!fs.existsSync(report)) {
            fs.appendFileSync(summary, "No Playwright report of " + share + " at " + report + "\n");
            process.exit(0);
          }
          const flaky = [];
          const walk = (suite) => {
            for (const spec of suite.specs || []) {
              if ((spec.tests || []).some((test) => test.status === "flaky")) {
                flaky.push((spec.file || suite.title) + ": " + spec.title);
              }
            }
            for (const child of suite.suites || []) walk(child);
          };
          walk(JSON.parse(fs.readFileSync(report, "utf8")));
          const lines = ["### Playwright " + share + ": " + flaky.length + " flaky test(s)"];
          for (const name of flaky) lines.push("- " + name);
          fs.appendFileSync(summary, lines.join("\n") + "\n");
        '

    # The artifact names its share: an artifact name is unique within a run, so three legs
    # under one name would fail all but the first.
    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ matrix.shard }}
        path: src/DM.Web.Client/playwright-report/
        if-no-files-found: warn

    # Half the failure modes are server-side (a migration that did not apply, a rejected
    # Origin, a 500 behind a spinner), which a browser timeout does not show.
    - name: API logs on failure
      if: failure()
      working-directory: docker
      run: docker compose logs --tail=300 dmapi migration

  dependency-scan:
    needs: [changes]
    if: needs.changes.outputs.dependency-scan == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # A gate, not a report: any advisory outside .github/vulnerability-allowlist.txt fails
    # the job; entries carry their reason.
    - name: .NET vulnerable packages
      run: ./scripts/check-vulnerable-packages.sh
    # Pinned to the patch, as everywhere (see the frontend job).
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    # --omit=dev: an advisory in vite, eslint or playwright is for dependabot to raise as a
    # PR, not a reason to block every push.
    - name: npm audit (production dependencies)
      run: cd src/DM.Web.Client && npm ci && npm audit --omit=dev --audit-level=high

  # CodeQL and the ZAP scan, in this graph so that publishing waits for them. Called on every
  # run; each of its jobs carries its own condition from the map, so a scan the change does
  # not need is skipped by name.
  security:
    needs: [changes]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    with:
      codeql: ${{ needs.changes.outputs.codeql == 'true' }}
      zap-scan: ${{ needs.changes.outputs.zap-scan == 'true' }}

  # DM.Architecture.Tests and the client unit specs for a change the build job is not called
  # for: both read documents, agent configuration and the client. Build runs the same
  # architecture tests and the frontend job the same specs, so each is skipped here when its
  # job runs.
  docs:
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    # StatusDocumentShould reads the client through the TypeScript compiler of its
    # node_modules, as in the build job.
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - name: Install client packages
      run: npm ci
      working-directory: src/DM.Web.Client
    - name: Architecture tests
      run: dotnet test test/DM.Architecture.Tests -c Release --verbosity normal
    - name: Client unit tests
      if: needs.changes.outputs.frontend != 'true'
      run: npm run test:coverage
      working-directory: src/DM.Web.Client

  publish:
    timeout-minutes: 30
    needs: [changes, build, frontend, e2e, dependency-scan, compose-topology, deployment-smoke, security, docs]
    runs-on: ubuntu-24.04
    # Every check succeeded or was skipped by the map, written out because the implicit
    # success() counts a skipped check as a reason to skip the publisher; failed and cancelled
    # are named, since failure() alone lets a check cancelled by concurrency through.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: DM.Web.API
            image_suffix: api
          - project: DM.Workers.Mail
            image_suffix: worker-mail
          - project: DM.Workers.NotificationDispatcher
            image_suffix: worker-notification
    steps:
    - uses: actions/checkout@v7

    # A mistyped project fails here in a second, not five minutes into a restore layer.
    - name: Verify project exists
      run: test -f "src/${{ matrix.project }}/${{ matrix.project }}.csproj"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
        # One tag, and it names a commit. promote-images sets the moving names once every
        # publisher has finished: set per leg, "latest" ended up a mixture of commits.
        tags: type=sha,prefix=

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/app.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          PROJECT_NAME=${{ matrix.project }}
          SOURCE_REVISION=${{ github.sha }}
        # A scope per image: unnamed, the builds overwrite one another's cache index.
        cache-from: type=gha,scope=${{ matrix.image_suffix }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}

  # The frontend has its own context and Dockerfile, so it cannot ride the publish matrix.
  publish-frontend:
    timeout-minutes: 30
    needs: [changes, build, frontend, e2e, dependency-scan, compose-topology, deployment-smoke, security, docs]
    runs-on: ubuntu-24.04
    # The condition of publish.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-front
        # One tag naming a commit, as in publish.
        tags: type=sha,prefix=

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ./src/DM.Web.Client
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=front
        cache-to: type=gha,mode=max,scope=front

# The moving names of the images, set once and after everything that could still fail. Each
# publisher pushes one tag naming a commit; "latest", the branch name and the release tag
# are what a deployment pulls, and set per matrix leg they could end up carrying a mixture.
# imagetools create copies a manifest by digest, so the bytes a moving name resolves to are
# the bytes that were tested.
  promote-images:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [ publish, publish-frontend ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Log in to the registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Point the moving names at this commit
      run: |
        SHA=$(echo "${{ github.sha }}" | cut -c1-7)

        NAMES=""
        case "${{ github.ref }}" in
          refs/heads/main) NAMES="latest main" ;;
          refs/heads/dev)  NAMES="dev" ;;
          refs/tags/v*)    NAMES="${GITHUB_REF#refs/tags/}" ;;
        esac

        # Nothing to move on a ref that publishes no name of its own.
        [ -n "$NAMES" ] || exit 0

        for image in api worker-mail worker-notification front; do
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-$image"
          for name in $NAMES; do
            docker buildx imagetools create --tag "$REPO:$name" "$REPO:$SHA"
          done
        done

  # A build context that does not exist, an overlay that no longer parses or a service
  # renamed out from under the installer must fail here, not on the server.
  compose-topology:
    needs: [changes]
    if: needs.changes.outputs.compose-topology == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    # Through scripts, not inline: every check of this job needs only docker, so it belongs in
    # the local set too, and a command written out in two places is one edit from checking two
    # different things. What each script checks, and why, is in the script.
    - name: The compose files and the installer must describe one deployment
      run: bash scripts/deployment/check-compose-topology.sh

    - name: The edge and the SPA server configurations must parse
      run: bash scripts/deployment/check-nginx-configuration.sh

    - name: The server installer must hold what it is written around
      run: bash scripts/deployment/check-server-installer.sh

    - name: The monitoring must parse, fire and reach a receiver
      run: bash scripts/deployment/check-monitoring.sh

    - name: Every shell script must pass shellcheck
      run: bash scripts/check-shell-scripts.sh

  # The pair that is actually deployed: e2e starts the base stack plus its own overlay and
  # talks to the API directly, so nginx, its basic auth, the SPA container and every route
  # through the edge ran for the first time on the server. This job starts that pair.
  deployment-smoke:
    needs: [changes]
    if: needs.changes.outputs.deployment-smoke == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # The same as in the end-to-end tier: compose declares the key with ${...:?} and stops on
    # interpolation before it starts anything.
    - name: Generate the throwaway secrets compose refuses to start without
      run: bash docker/scripts/init-env.sh local
    # The repository ships no credentials; without the file docker creates a directory in its
    # place and nginx does not start.
    - name: Generate the stand credentials
      env:
        DM_PREVIEW_PASSWORD: smoke-test-password
      run: bash docker/scripts/init-htpasswd.sh

    - name: Start the pair the installer and the unit deploy
      working-directory: docker
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.preview.yml
        ASPNETCORE_ENVIRONMENT: Production
      # Object storage comes first and with --wait: the site starts without it, so this line is
      # where an image the registry no longer serves, or a bucket the server did not create,
      # stops the job.
      run: |
        docker compose up -d --wait storage seaweedfs
        docker compose up -d postgres mailpit jaeger
        docker compose up -d --build --wait migration
        docker compose up -d --build --wait dmapi
        docker compose up -d --build --wait nginx

    # The same script an operator runs against the public address after the containers have
    # been replaced. The storage check and the nightly backup ride along: an operator runs
    # both against the server, and this is the one Linux host where the host network reaches
    # the published port as it does there. A new SeaweedFS tag is taken only with this green.
    - name: The edge answers where the deployment needs it to
      env:
        BACKUP_DIR: ${{ runner.temp }}/storage-backup
      run: |
        bash docker/scripts/smoke-edge.sh http://localhost preview smoke-test-password
        bash docker/scripts/check-storage.sh
        bash docker/scripts/backup-storage.sh

    # The revoke of postgres-init.sh, read back from the server the pair runs on.
    - name: Only the application role may connect to the application database
      run: bash docker/scripts/check-database-privileges.sh

    # The backup script's exclusion read back from a real dump of the migrated schema: a
    # waiting letter keeps a live link in plaintext, and an unquoted pattern dumps it anyway.
    - name: The nightly dump holds no outbox rows and restores with an empty outbox table
      run: bash docker/scripts/check-dump-excludes-outbox.sh

    - name: Logs on failure
      if: failure()
      working-directory: docker
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.preview.yml
      run: docker compose logs --tail=200 nginx dmapi dmfront storage seaweedfs
