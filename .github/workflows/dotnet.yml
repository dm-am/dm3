name: .NET

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger trx --results-directory TestResults --collect:"Code Coverage"
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/**/*.coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/DM.Web.Modern
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/DM.Web.Modern/package-lock.json
    - run: npm ci
    - run: npm run type-check
    - run: npm run build
    - run: npm run test:coverage
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: frontend/DM.Web.Modern/coverage/
        if-no-files-found: warn

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: .NET vulnerable packages
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/dotnet-audit.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/DM.Web.Modern/package-lock.json
    - name: npm audit
      run: cd frontend/DM.Web.Modern && npm ci && npm audit --audit-level=high || true

  publish:
    needs: [build, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: DM.Web.API
            image_suffix: api
          - project: DM.Services.Mail.Sender.Consumer
            image_suffix: consumer-mail
          - project: DM.Services.Search.Consumer
            image_suffix: consumer-search
          - project: DM.Services.Notifications.Consumer
            image_suffix: consumer-notification
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image_suffix }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/app.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          PROJECT_NAME=${{ matrix.project }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
