name: .NET

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Least privilege by default; the publish job widens it for itself only.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image names must match what docker/docker-compose.yml pulls
  # (ghcr.io/<owner>/dm-api, dm-worker-*), otherwise CI publishes artifacts
  # no deployment ever consumes.
  IMAGE_PREFIX: ${{ github.repository_owner }}/dm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    # Release is what ships (docker/app.Dockerfile publishes -c Release), so it
    # is what gets compiled and tested here.
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DM.Web.Client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - run: npm ci
    - name: Lint
      run: npm run lint:ci
    - run: npm run type-check
    - run: npm run build
    - run: npm run test:coverage
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: src/DM.Web.Client/coverage/
        if-no-files-found: warn

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    # Gate, not a report: any advisory outside the reviewed allow-list fails
    # the job. Entries live in .github/vulnerability-allowlist.txt with the
    # reason they are accepted.
    - name: .NET vulnerable packages
      run: ./scripts/check-vulnerable-packages.sh
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - name: npm audit
      run: cd src/DM.Web.Client && npm ci && npm audit --audit-level=high

  publish:
    needs: [build, frontend, dependency-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: DM.Web.API
            image_suffix: api
          - project: DM.Workers.Mail
            image_suffix: worker-mail
          - project: DM.Workers.SearchIndexer
            image_suffix: worker-search
          - project: DM.Workers.NotificationDispatcher
            image_suffix: worker-notification
    steps:
    - uses: actions/checkout@v4

    # A renamed or mistyped project must fail here in one second, not five
    # minutes later inside a Docker restore layer.
    - name: Verify project exists
      run: test -f "src/${{ matrix.project }}/${{ matrix.project }}.csproj"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/app.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          PROJECT_NAME=${{ matrix.project }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
