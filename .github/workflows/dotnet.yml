name: .NET

on:
  push:
    branches: [ main, dev ]
    # The installer pins a release by tag and says why: a tag names one tree, so
    # the same command a month later brings up the same site. Nothing published
    # an image under that name, so the documented install path pulled a tag the
    # registry had never heard of.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

# Least privilege by default; the publish job widens it for itself only.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight — except on the
# refs that publish. Cancelling between two legs of the publish matrix leaves the
# registry holding half of a release, and the run that superseded it will not
# rebuild the half that made it.
#
# What guarantees that one tag means one commit is promote-images, which sets the
# moving names after every publisher has finished; this only keeps a superseded
# run from leaving orphaned digests behind. On a pull request there is nothing to
# publish, so superseding is free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) }}

env:
  REGISTRY: ghcr.io
  # Image names must match what docker/docker-compose.yml pulls
  # (ghcr.io/<owner>/dm-api, dm-worker-*), otherwise CI publishes artifacts
  # no deployment ever consumes.
  IMAGE_PREFIX: ${{ github.repository_owner }}/dm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    # .editorconfig declares a final newline and no trailing whitespace for the
    # whole tree, and nothing checked it: 134 C# files had drifted out of the
    # first rule. A file without a final newline adds a line to every diff that
    # touches it, so review reads noise instead of the change, and the count only
    # grows. The whitespace subcommand is deliberate: it skips the analyzer pass,
    # which would make this a slow gate on rules the project never declared. It
    # is narrower than .editorconfig, though, and the comment used to claim they
    # were equal. It reformats C# only, and inside C# it leaves trailing
    # whitespace in comment lines alone, so trim_trailing_whitespace outside C#
    # and inside comments is on review, not on this step.
    - name: Format
      run: dotnet format DM.sln whitespace --verify-no-changes
    # Release is what ships (docker/app.Dockerfile publishes -c Release), so it
    # is what gets compiled and tested here.
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
    # The cobertura was collected and uploaded with if-no-files-found: error - a
    # guarantee that the file exists, with no threshold anywhere, so deleting
    # tests or adding a module without any passed every gate green. The frontend
    # has had a ratchet since it had tests at all; this is the same rule for the
    # solution, and the numbers live next to the reason in the script.
    - name: Coverage threshold
      run: bash scripts/check-coverage.sh
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: error
    # The contract only existed inside a running Development container: Swagger
    # is not served in production. The integration suite writes it out so it can
    # be diffed between builds and consumed outside the process.
    - name: Upload OpenAPI contract
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openapi-contract
        path: artifacts/openapi/*.json
        if-no-files-found: error

  frontend:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DM.Web.Client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    - run: npm ci
    - name: Lint
      run: npm run lint:ci
    - run: npm run type-check
    - run: npm run build
    - run: npm run test:coverage
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: src/DM.Web.Client/coverage/
        if-no-files-found: warn

  # The end-to-end tier, which until now ran nowhere: 32 spec files and the 235
  # tests in them, which only ever ran on the owner's machine, so nothing stopped a merge
  # from breaking them and nobody found out until the next manual run.
  #
  # It needs a real stack, not a mock — the suite talks to the API over HTTP and
  # asserts on what a browser renders — so the shape below is the one zap-scan
  # already uses, plus a seed.
  e2e:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      # Every compose invocation in this job means the pair, and repeating the
      # flags five times is how one of them ends up missing the overlay.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      # docker/.env.example ends with Development for local work, and a tier that
      # exercises Development proves nothing about the build that ships: Swagger
      # is mapped only there, and the content policy of the API relaxes its
      # script-src for it. Through the environment rather than by rewriting a
      # line of the file, the way the throwaway encryption key below is handed
      # in: compose prefers the environment over .env.
      ASPNETCORE_ENVIRONMENT: Production
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # docker/.env.example ships the encryption key and the imgproxy signing pair
    # empty, and compose declares all three with ${...:?}, which rejects an empty
    # value as hard as a missing one. They go into the job environment rather
    # than into .env: compose prefers the environment over the file, so no step
    # has to edit a line of a file it does not own, and the values die with the
    # runner.
    - name: Generate the throwaway secrets compose refuses to start without
      run: |
        echo "DM_CryptoConfiguration__KeyBase64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        echo "IMGPROXY_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "IMGPROXY_SALT=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Create .env for Docker Compose
      run: cp docker/.env.example docker/.env

    # Load-bearing, not a convenience. One /games load is 17 API requests — 3 for
    # the page and 14 for the site shell — against a global budget of 100 per
    # address per minute, so a 38-test spec file burns the whole minute in three
    # tests and every test after that fails on a data-loading error that looks
    # exactly like a stale selector. RateLimiting:Enabled=false registers every
    # policy as a no-op, which is what a single-address test runner needs.
    #
    # Generated here rather than committed: docker-compose.yml and
    # docker-compose.preview.yml are the combination that gets deployed and the
    # compose-topology job validates exactly that pair. A knob that must never
    # reach a server does not belong in that set.
    - name: Overlay that turns rate limiting off and lets the preview origin in
      run: |
        cat > docker/docker-compose.e2e.yml <<'YAML'
        services:
          dmapi:
            environment:
              DM_RateLimiting__Enabled: "false"
              # The port the suite serves the built bundle from. The API derives
              # the origins a browser may call it from - its public address plus
              # the site's own hosts - and adds the two development ports only
              # when the environment is Development, which this job is not. Left
              # out, every request from the page carries an origin the API does
              # not answer to: CORS drops the responses and the origin check
              # refuses the writes, so the specs fail on locators that never fill.
              DM_SiteAddressConfiguration__AdditionalOrigins__0: "http://localhost:5174"
        YAML

    # --build on the migration line too. Its image is the API image, and the API
    # image is now the tag the registry publishes: compose pulls a missing image
    # before it considers building one, so a plain "up" here would migrate the
    # database with the published build and test a commit that is not this one.
    - name: Start the stack
      working-directory: docker
      run: |
        docker compose config --quiet
        docker compose up -d postgres mongo rabbitmq minio mailhog jaeger
        docker compose up -d --build --wait migration
        docker compose up -d --build --wait dmapi

    - name: Wait for API health
      run: timeout 60 bash -c 'until curl -sf http://localhost:5000/_health; do sleep 2; done'

    # The suite asserts against seeded accounts and content: global setup logs in
    # as admin@test.local before the first spec, and an unseeded database fails
    # the whole run in that one step.
    - name: Seed the database
      working-directory: docker
      run: docker compose run --rm -T --build seeder all

    - name: Install dependencies
      working-directory: src/DM.Web.Client
      run: npm ci

    # Chromium only. The config declares nine projects; the other eight would
    # multiply both the wall clock and the request count by nine to re-verify the
    # same assertions against engines whose behaviour differences this suite does
    # not test for. Cross-browser belongs on a schedule, where a two-hour matrix
    # costs nobody a review cycle — not on a pull request.
    - name: Install Chromium
      working-directory: src/DM.Web.Client
      run: npx playwright install --with-deps chromium

    # playwright.config.ts builds the bundle and serves it with vite preview on
    # port 5174. The API validates Origin twice - the CORS policy and the check
    # that stands in for a CSRF token read one derived list - and 5174 is not in
    # it under Production, so the overlay above adds it for this run.
    - name: Run the suite
      working-directory: src/DM.Web.Client
      run: npx playwright test --project=chromium

    # retries: 2 in CI means a test that failed twice and passed on the third
    # attempt leaves the job green, and the only evidence used to be inside an
    # HTML artifact somebody has to download and open. A flake that nobody sees
    # is a test on its way to being deleted for being "always red anyway", so the
    # count and the names go on the run page itself, whether the suite passed or
    # not. The reporter that writes the file is declared in playwright.config.ts.
    - name: Flaky tests of this run
      if: always()
      working-directory: src/DM.Web.Client
      # Node rather than jq: the job already installs it, and the same script runs
      # on a developer machine. A spec is flaky when Playwright retried it into a
      # pass; suites nest, so the walk is recursive.
      run: |
        node -e '
          const fs = require("fs");
          const report = "playwright-report/results.json";
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(report)) {
            fs.appendFileSync(summary, "No Playwright report at " + report + "\n");
            process.exit(0);
          }
          const flaky = [];
          const walk = (suite) => {
            for (const spec of suite.specs || []) {
              if ((spec.tests || []).some((test) => test.status === "flaky")) {
                flaky.push((spec.file || suite.title) + ": " + spec.title);
              }
            }
            for (const child of suite.suites || []) walk(child);
          };
          walk(JSON.parse(fs.readFileSync(report, "utf8")));
          const lines = ["### Playwright: " + flaky.length + " flaky test(s)"];
          for (const name of flaky) lines.push("- " + name);
          fs.appendFileSync(summary, lines.join("\n") + "\n");
        '

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: src/DM.Web.Client/playwright-report/
        if-no-files-found: warn

    # A red run whose only evidence is a browser-side timeout is not diagnosable.
    # Half the failure modes here are server-side: a migration that did not
    # apply, a rejected Origin, a 500 behind a spinner.
    - name: API logs on failure
      if: failure()
      working-directory: docker
      run: docker compose logs --tail=300 dmapi migration

  dependency-scan:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    # Gate, not a report: any advisory outside the reviewed allow-list fails
    # the job. Entries live in .github/vulnerability-allowlist.txt with the
    # reason they are accepted.
    - name: .NET vulnerable packages
      run: ./scripts/check-vulnerable-packages.sh
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/DM.Web.Client/package-lock.json
    # --omit=dev on purpose: an advisory in vite/eslint/playwright is a
    # tooling problem for dependabot to raise as a PR, not a reason to block
    # every push. What ships to a browser is what gates the build.
    - name: npm audit (production dependencies)
      run: cd src/DM.Web.Client && npm ci && npm audit --omit=dev --audit-level=high

  # CodeQL and the ZAP scan, pulled into this graph so that publishing can wait
  # for them. They used to live in a workflow of their own, triggered by the same
  # push and reachable from no `needs` at all.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  publish:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    needs: [build, frontend, e2e, dependency-scan, compose-topology, deployment-smoke, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - project: DM.Web.API
            image_suffix: api
          - project: DM.Workers.Mail
            image_suffix: worker-mail
          - project: DM.Workers.NotificationDispatcher
            image_suffix: worker-notification
    steps:
    - uses: actions/checkout@v4

    # A renamed or mistyped project must fail here in one second, not five
    # minutes later inside a Docker restore layer.
    - name: Verify project exists
      run: test -f "src/${{ matrix.project }}/${{ matrix.project }}.csproj"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
        # One tag, and it names a commit. The moving names - latest, the branch,
        # the release tag - are set by promote-images once every publisher has
        # finished, because each leg of this matrix finishes at its own moment: set
        # here, "latest" was whatever mixture of commits the legs happened to end
        # in, and a leg that failed left the others carrying the name alone.
        tags: type=sha,prefix=

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/app.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          PROJECT_NAME=${{ matrix.project }}
          SOURCE_REVISION=${{ github.sha }}
        # A scope per image. Left unnamed, all four builds write the default scope
        # of the same ref and overwrite one another's index: the cache is present,
        # paid for, and useless.
        cache-from: type=gha,scope=${{ matrix.image_suffix }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}

  # The frontend has its own context and Dockerfile, so it cannot ride the
  # publish matrix without conditionals in every step. Until this job existed the
  # SPA image was never built by CI at all: the only thing that referenced it was
  # a compose service pointing at a directory that does not exist.
  publish-frontend:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    needs: [build, frontend, e2e, dependency-scan, compose-topology, deployment-smoke, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-front
        # One tag, and it names a commit. The moving names - latest, the branch,
        # the release tag - are set by promote-images once every publisher has
        # finished, because each leg of this matrix finishes at its own moment: set
        # here, "latest" was whatever mixture of commits the legs happened to end
        # in, and a leg that failed left the others carrying the name alone.
        tags: type=sha,prefix=

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: ./src/DM.Web.Client
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=front
        cache-to: type=gha,mode=max,scope=front

# The moving names of the images, set once and after everything that could
  # still fail.
  #
  # Each publisher pushes one tag, and it names a commit. "latest", the branch
  # name and the release tag are what a deployment actually pulls, and until this
  # job existed each leg of the publish matrix set them for itself, at whatever
  # moment it happened to finish: a leg that failed left the other three carrying
  # the name alone, and compose pins all four to one tag on the promise that they
  # came from one commit. Nothing downstream detects the mixture.
  #
  # imagetools create copies a manifest by digest, so nothing is rebuilt here and
  # the bytes a moving name resolves to are the bytes that were tested.
  promote-images:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [ publish, publish-frontend ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Log in to the registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Point the moving names at this commit
      run: |
        SHA=$(echo "${{ github.sha }}" | cut -c1-7)

        NAMES=""
        case "${{ github.ref }}" in
          refs/heads/main) NAMES="latest main" ;;
          refs/heads/dev)  NAMES="dev" ;;
          refs/tags/v*)    NAMES="${GITHUB_REF#refs/tags/}" ;;
        esac

        # Nothing to move on a ref that publishes no name of its own.
        [ -n "$NAMES" ] || exit 0

        for image in api worker-mail worker-notification front; do
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-$image"
          for name in $NAMES; do
            docker buildx imagetools create --tag "$REPO:$name" "$REPO:$SHA"
          done
        done

  # A build context that does not exist, an overlay that no longer parses or a
  # service renamed out from under the installer must fail here, not on the
  # server. This is the check that would have caught the frontend context
  # pointing at a directory removed long ago.
  compose-topology:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Declared once for the job rather than per step. Compose rejects an empty
    # ${VAR:?} as firmly as a missing one, so every step that runs `config` needs
    # the whole set, and the two that do carried identical copies of it: a
    # variable added to one and not the other fails the second step with a
    # message about the compose file rather than about the omission. The set is
    # not secret — these are placeholders whose only job is to be non-empty, and
    # naming them here says that plainly.
    env:
      DM_CryptoConfiguration__KeyBase64: ci-validation-placeholder
      MONGO_ROOT_PASSWORD: ci-validation-placeholder
      MONGO_PASSWORD: ci-validation-placeholder
      POSTGRES_PASSWORD: ci-validation-placeholder
      RABBITMQ_DEFAULT_PASS: ci-validation-placeholder
      MINIO_ROOT_PASSWORD: ci-validation-placeholder
      MINIO_APP_PASSWORD: ci-validation-placeholder
      MINIO_IMGPROXY_PASSWORD: ci-validation-placeholder
      GF_SECURITY_ADMIN_PASSWORD: ci-validation-placeholder
      IMGPROXY_KEY: ci-validation-placeholder
      IMGPROXY_SALT: ci-validation-placeholder
      POP_UPSTREAM: https://ci-validation-placeholder
      POP_UPSTREAM_HOST: ci-validation-placeholder
    steps:
    - uses: actions/checkout@v4

    - name: Validate the deployed overlay combination
      working-directory: docker
      run: |
        docker compose --env-file /dev/null -f docker-compose.yml config --quiet
        docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.preview.yml config --quiet
        docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.preview.yml -f docker-compose.mirror.yml config --quiet

    - name: Every build context the overlay names must exist
      working-directory: docker
      run: |
        # Take everything after the key rather than a whitespace-split field:
        # compose resolves contexts to absolute paths, and a path may contain
        # spaces.
        docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.preview.yml config \
          | sed -n 's/^[[:space:]]*context:[[:space:]]*//p' | sort -u | while read -r ctx; do
              echo "checking build context: $ctx"
              test -d "$ctx" || { echo "::error::build context does not exist: $ctx"; exit 1; }
            done

    - name: The unit systemd runs must name the same files and profiles as the installer
      run: |
        # Profiles as well as files: watchtower lives behind the production
        # profile, and a unit that drops it stops updating the stand at the first
        # reboot with nothing in the logs to say so.
        pattern='(\-f [a-z.-]+\.yml|--profile [a-z]+)'
        installer=$(grep -oE "$pattern" docker/setup-server.sh | sort -u)
        unit=$(grep -oE "$pattern" docker/dm3.service | sort -u)
        echo "installer: $installer"
        echo "unit:      $unit"
        # Non-empty first, and named positively after that. Two empty extractions
        # compare equal, so a switch to --file, to COMPOSE_FILE or to a path
        # outside the character class above would have left this step green on
        # nothing at all - while the failure it exists to catch came back.
        test -n "$installer" || { echo "::error::no compose files or profiles found in docker/setup-server.sh"; exit 1; }
        test -n "$unit" || { echo "::error::no compose files or profiles found in docker/dm3.service"; exit 1; }
        printf '%s\n' "$installer" | grep -qx -- '-f docker-compose.preview.yml' || { echo "::error::the installer no longer names the overlay the site lives in"; exit 1; }
        printf '%s\n' "$installer" | grep -qx -- '--profile production' || { echo "::error::the installer no longer enables the profile watchtower lives behind"; exit 1; }
        test "$installer" = "$unit" || { echo "::error::dm3.service and setup-server.sh disagree on the compose files or profiles"; exit 1; }

    # Nothing compiled the edge: a typo in either nginx.conf was a crash-looping
    # container on the server, which is the whole site, and a typo in the alert
    # rules stopped Prometheus from starting at all. All three tools run in a
    # container so the versions match what the deployment runs.
    - name: The edge and the SPA server configurations must parse
      run: |
        # The upstreams are resolved at start-up and none of them exists here.
        # The password file is mounted because the door lives in the shared
        # locations file now, and nginx refuses one it cannot open.
        printf 'preview:$apr1$syntax$0123456789abcdefghijk\n' > /tmp/edge-htpasswd
        docker run --rm \
          --add-host dmapi:127.0.0.1 --add-host dmfront:127.0.0.1 \
          --add-host minio:127.0.0.1 --add-host imgproxy:127.0.0.1 \
          -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/docker/nginx/edge-locations.conf:/etc/nginx/edge-locations.conf:ro" \
          -v "/tmp/edge-htpasswd:/etc/nginx/.htpasswd:ro" \
          nginx:1.27-alpine nginx -t
        # And with the TLS server the issuing script writes. This is the half that
        # used to be a commented-out copy: nothing parsed it, and by the time
        # anybody would have switched it on it had lost the health probe and
        # carried a listen directive nginx has warned about since 1.25.
        mkdir -p /tmp/edge-tls /tmp/edge-ssl/live/dm
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout /tmp/edge-ssl/live/dm/privkey.pem \
          -out /tmp/edge-ssl/live/dm/fullchain.pem \
          -subj "/CN=edge-syntax-check" 2>/dev/null
        sed -n '/^cat > /,/^EOF$/p' docker/scripts/init-ssl.sh \
          | sed '1d;$d;s/\$PRIMARY/edge-syntax-check/g' \
          > /tmp/edge-tls/tls.conf
        docker run --rm \
          --add-host dmapi:127.0.0.1 --add-host dmfront:127.0.0.1 \
          --add-host minio:127.0.0.1 --add-host imgproxy:127.0.0.1 \
          -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
          -v "$PWD/docker/nginx/edge-locations.conf:/etc/nginx/edge-locations.conf:ro" \
          -v "/tmp/edge-htpasswd:/etc/nginx/.htpasswd:ro" \
          -v "/tmp/edge-tls:/etc/nginx/tls:ro" \
          -v "/tmp/edge-ssl:/etc/nginx/ssl:ro" \
          nginx:1.27-alpine nginx -t
        # The SPA config is a server block, not a whole configuration: it is
        # mounted where the image includes it from.
        docker run --rm \
          -v "$PWD/src/DM.Web.Client/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
          nginx:1.27-alpine nginx -t
        # The second door is a third edge, serving a whole public address of its
        # own. It arrives as a template, so the image's own entrypoint renders it
        # first; the certificate is generated here because the configuration
        # refuses to start without one, which is the point of it.
        mkdir -p /tmp/pop-ssl/live/dm
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout /tmp/pop-ssl/live/dm/privkey.pem \
          -out /tmp/pop-ssl/live/dm/fullchain.pem \
          -subj "/CN=pop-syntax-check" 2>/dev/null
        docker run --rm \
          --add-host dmfront:127.0.0.1 \
          -e POP_UPSTREAM=https://127.0.0.1 \
          -e POP_UPSTREAM_HOST=pop-syntax-check \
          -e NGINX_ENVSUBST_FILTER='^POP_' \
          -v "$PWD/docker/nginx/pop.conf.template:/etc/nginx/templates/default.conf.template:ro" \
          -v "/tmp/pop-ssl:/etc/nginx/ssl:ro" \
          nginx:1.27-alpine \
          sh -c '/docker-entrypoint.sh nginx -t'

    # The installer's first act, and the one that has to hold: run twice it
    # reached a clone into a non-empty directory and died there, having already
    # installed packages and restarted the docker daemon of a running stand.
    - name: The installer must refuse a directory it would install over
      run: |
        empty="$(mktemp -d)"
        bash docker/scripts/require-empty-install-dir.sh "$empty" ||
          { echo "::error::the guard refuses an empty directory, so the installer can never run"; exit 1; }

        occupied="$(mktemp -d)"
        touch "$occupied/docker-compose.yml"
        if bash docker/scripts/require-empty-install-dir.sh "$occupied" 2>/dev/null; then
          echo "::error::the guard accepts a directory that already holds a stand"; exit 1
        fi

        # Order is the whole point: asked after apt, the answer arrives on a
        # machine the installer has already changed.
        guard=$(grep -n 'require-empty-install-dir.sh' docker/setup-server.sh | head -1 | cut -d: -f1)
        clone=$(grep -n 'git clone' docker/setup-server.sh | head -1 | cut -d: -f1)
        apt=$(grep -n 'apt install' docker/setup-server.sh | head -1 | cut -d: -f1)
        test -n "$guard" || { echo "::error::setup-server.sh never asks the guard"; exit 1; }
        test "$guard" -lt "$clone" || { echo "::error::the guard runs after the clone it exists to precede"; exit 1; }
        test "$guard" -lt "$apt" || { echo "::error::the guard runs after the packages are installed"; exit 1; }

    # A variable added to .env.example reaches nobody by itself: docker/.env is
    # machine-local and never regenerated, so the next release refuses to start
    # on a stand that worked yesterday. That is how splitting the Postgres roles
    # stopped every local reset - the two passwords it needs were in the template
    # and in nobody's file. init-env.sh carries them over in local mode, and this
    # is the only thing that says so.
    - name: The installer of the environment file must carry a new variable over
      run: |
        work="$(mktemp -d)"
        mkdir -p "$work/scripts"
        cp docker/scripts/init-env.sh "$work/scripts/"
        cp docker/.env.example "$work/"

        # A file written before the newest variable existed, which is the case.
        grep -v "^DM_APP_PASSWORD=" docker/.env.example > "$work/.env"
        bash "$work/scripts/init-env.sh" local > /dev/null

        grep -q "^DM_APP_PASSWORD=" "$work/.env" ||
          { echo "::error::init-env.sh left a variable of .env.example out of an existing .env; every local stand breaks on the next one added"; exit 1; }

        # And it must not touch a value somebody already chose.
        printf "MONGO_PASSWORD=chosen-by-hand\n" >> "$work/.env"
        bash "$work/scripts/init-env.sh" local > /dev/null
        grep -q "^MONGO_PASSWORD=chosen-by-hand" "$work/.env" ||
          { echo "::error::init-env.sh overwrote a value that was already in .env"; exit 1; }
    - name: The Prometheus configuration and its alert rules must parse
      run: |
        docker run --rm \
          -v "$PWD/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          -v "$PWD/docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
          --entrypoint promtool prom/prometheus:v2.51.0 \
          check config /etc/prometheus/prometheus.yml

    # And parsing is all the step above does. An expression that reads the wrong
    # series parses exactly as well as the right one: the backlog rule counted
    # only the messages still waiting, so a worker holding a thousand of them
    # read as an empty queue, and the rule was silent on the very state it was
    # written for. These run each rule over a series and assert what it does.
    - name: The alert rules must fire on what they are written for
      run: |
        docker run --rm \
          -v "$PWD/docker/prometheus:/rules:ro" \
          -w /rules \
          --entrypoint promtool prom/prometheus:v2.51.0 \
          test rules alerts_test.yml

    # promtool above is happy with rules that go nowhere, and that is what this
    # repository ran: rule_files with no alerting section and no alertmanager to
    # name in one. Every rule reached a firing state inside Prometheus and stayed
    # there, so an outage was found by opening /alerts through a tunnel.
    - name: Every alert rule must reach a receiver the stack runs
      run: |
        grep -q '^rule_files:' docker/prometheus.yml ||
          { echo "::error::prometheus.yml evaluates no rules of its own any more - this check is about the ones it does"; exit 1; }

        # The alerting section only, up to the next key at column zero: a
        # "targets:" line taken from the whole file would match a scrape job and
        # pass on a configuration that delivers nothing.
        # `|| true` because the step runs under `bash -e` and the last grep exits
        # 1 when there is no alerting section at all - which is the very case the
        # message below exists for. Without it the step died on the assignment,
        # printed nothing, and left whoever broke it an exit code to guess from.
        targets=$(sed -n '/^alerting:/,/^[^[:space:]#]/p' docker/prometheus.yml |
          grep -oE "targets:[[:space:]]*\[[^]]*\]" | grep -oE "[a-z0-9.-]+:[0-9]+" || true)
        test -n "$targets" || { echo "::error::prometheus.yml declares rule_files and no alertmanager to post them to"; exit 1; }

        for target in $targets; do
          echo "checking alert target: $target"
          grep -q "container_name: '${target%%:*}'" docker/docker-compose.yml ||
            { echo "::error::nothing in the stack answers to ${target%%:*}, so every notification is a connection refused"; exit 1; }
        done

    # The one thing no test in the solution can do: start it. The configuration
    # is rendered from the environment at container start, so a template that
    # cannot produce a file alertmanager accepts is a receiver that is not there
    # - and nothing else in the pipeline runs this container.
    - name: The alert receiver must render its configuration and start
      run: |
        docker run --rm \
          -v "$PWD/docker/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
          -v "$PWD/docker/alertmanager-init.sh:/alertmanager-init.sh:ro" \
          --entrypoint /bin/sh prom/alertmanager:v0.27.0 \
          -c '/alertmanager-init.sh --render-only && amtool check-config /tmp/alertmanager.yml'

        docker run -d --name alert-receiver-gate \
          -v "$PWD/docker/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
          -v "$PWD/docker/alertmanager-init.sh:/alertmanager-init.sh:ro" \
          --entrypoint /bin/sh prom/alertmanager:v0.27.0 /alertmanager-init.sh

        ready=0
        for _ in $(seq 1 20); do
          if docker exec alert-receiver-gate wget --spider -q http://localhost:9093/-/healthy; then
            ready=1
            break
          fi
          sleep 1
        done

        docker logs alert-receiver-gate
        docker rm -f alert-receiver-gate > /dev/null
        test "$ready" = 1 || { echo "::error::the alert receiver does not start with the configuration in this repository"; exit 1; }

    # Every tracked script, not a hand kept list: the backup jobs run at two in
    # the morning into a log nobody reads, so a typo in one of them is found by
    # a failed restore.
    - name: Every shell script must pass shellcheck
      run: |
        docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
          $(git ls-files '*.sh') scripts/hooks/pre-push

  # The pair that actually gets deployed had never been started by anything: e2e
  # brings up the base stack plus its own overlay and talks to the API directly,
  # so nginx, its basic auth, the SPA container and every route through the edge
  # were executed for the first time on the server. Three of the deployment
  # defects this repository has already fixed - the API port outside the
  # perimeter, the session cookie, the unreachable transform layer - are that one
  # class, and none of them could have failed a gate.
  deployment-smoke:
    # Ends a hang instead of holding the branch for the six hours
    # GitHub allows by default. Deliberately far above the real time:
    # a ceiling guessed close turns a slow runner into a red build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The same three the end-to-end tier generates, and for the same reason:
    # compose declares them with ${...:?} and stops on interpolation before it
    # starts anything.
    - name: Generate the throwaway secrets compose refuses to start without
      run: |
        echo "DM_CryptoConfiguration__KeyBase64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        echo "IMGPROXY_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
        echo "IMGPROXY_SALT=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Create .env for Docker Compose
      run: cp docker/.env.example docker/.env

    # The repository ships no credentials, and without the file docker creates a
    # directory in its place and nginx does not start.
    - name: Generate the stand credentials
      env:
        DM_PREVIEW_PASSWORD: smoke-test-password
      run: bash docker/scripts/init-htpasswd.sh

    - name: Start the pair the installer and the unit deploy
      working-directory: docker
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.preview.yml
        ASPNETCORE_ENVIRONMENT: Production
      # imgproxy on the list because nginx resolves the hosts it proxies to at
      # start-up: the transform location names imgproxy literally, so without
      # that container the edge exits with "host not found in upstream" and the
      # whole job waits on a health check that will never pass. It is part of
      # the pair being deployed, not a convenience.
      run: |
        docker compose up -d postgres mongo rabbitmq minio imgproxy mailhog jaeger
        docker compose up -d --build --wait migration
        docker compose up -d --build --wait dmapi
        docker compose up -d --build --wait nginx

    # The same script an operator runs against the public address after the
    # containers have been replaced. Written out here as well, the two lists were
    # one edit away from a pipeline that checks something the operator does not.
    - name: The edge answers where the deployment needs it to
      run: bash docker/scripts/smoke-edge.sh http://localhost preview smoke-test-password

    - name: Logs on failure
      if: failure()
      working-directory: docker
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.preview.yml
      run: docker compose logs --tail=200 nginx dmapi dmfront
