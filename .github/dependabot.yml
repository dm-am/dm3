version: 2

# Security patches arrive as PRs instead of being discovered by an audit six
# months later. Grouped so a routine version bump is one review, not thirty.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.EntityFrameworkCore*"
          - "System.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      test-stack:
        patterns:
          - "xunit*"
          - "NSubstitute*"
          - "AwesomeAssertions"
          - "Testcontainers*"
          - "TngTech.ArchUnitNET*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: npm
    directory: /src/DM.Web.Client
    schedule:
      interval: weekly
    # The floor of min-release-age in .npmrc: npm ci does not apply it, so the
    # update channel that resolves the lock has to.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "pinia"
      tiptap:
        patterns:
          - "@tiptap/*"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Base images of both Dockerfiles. A pinned tag stops
  # resolving to whatever the registry holds that day, and moving it becomes a
  # reviewed pull request instead of a silent change at the next "up -d".
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # The images of the compose files, for the same reason: the docker entry reads
  # Dockerfiles only, so without this one nobody moves the pins of the edge and the
  # object store.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /src/DM.Web.Client
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
